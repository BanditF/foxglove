[[step]]
match = "Plugins on the board: Pomodoro panel and lights"
script = ["scripts/lab/pomodoro.py", "scripts/lab/mic_mute.py", "scripts/lab/obs_mock.py"]
needs_eyes = "a real VB-CABLE mute and a real OBS recording (the lab uses mocks)"

# --- Screens ---

[[step]]
match = "Left screen: the clock and date follow the region settings"
hil = ["screens/left-clock-ticks", "screens/capture-both"]
needs_eyes = "changing Windows' region settings is a system setting; locking the PC is the user's desktop"

[[step]]
match = "Notifications on the left screen: a real toast arrives"
log = ["Foxglove notifications: "]
hil = ["screens/capture-both"]
needs_eyes = "Do not disturb and a full-screen game are the user's desktop; the light cue on both halves is seen"

[[step]]
match = "Right-screen art: Keep (send, SAVE, SELECT)"
api = ["art.status", "art.select"]
lab = ["art-status"]
hil = ["app-idle/art-select-builtin"]
needs_eyes = "hands: a power cycle of the right with a kept piece; Keep is a Screens page button"

[[step]]
match = "Art across a firmware update, the five steps"
lab = ["art-status"]
api = ["art.status", "art.select", "tray.set_panel", "tray.panel"]
cli = ["art", "panel"]
script = ["scripts/lab/overlay_tray.py"]
log = ["(api): "]
note = "#618: the tray's Next › and ‹ are art.select next/previous (the same command), the panel's name is art.status name; the flash is On-call's"
needs_eyes = "Art… and the Change… picker open UI that is only seen (no API for the picker)"

[[step]]
match = "Keymap editor on the Corne over USB and over Bluetooth"
needs_eyes = "the keymap editor is UI only (no API for keymap edits); a replug needs hands"

# --- Case ---

