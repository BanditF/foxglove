log = ["calibrate: "]
api = ["pc_lighting.list", "lighting.state"]
needs_eyes = "eyes: matching colours against the screen is the person's judgement"

[[step]]
match = "Scenes on the case: zone order and positions"
log = ["scene {name} started", "scene {} ended ({}){}"]
needs_eyes = "no API or CLI call starts a scene; zone order and positions on the real case are seen"

[[step]]
match = "The ambient zone fades with the fans"
needs_eyes = "eyes: the fade against the fans and the wallpaper looks on the case and keyboard"

[[step]]
