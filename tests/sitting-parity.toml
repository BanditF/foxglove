# What truly can't be automated (docs/test-lab/sitting-0.2-h-i-r.md "What's left"): none is a
# step of the sitting, none blocks 0.2.

[[residual]]
id = "unpowered-panel"
replaces = ["R1", "R4"]
kind = "eyes, optional"
needs_eyes = "what the right's panel shows while its power is cut with the LEDs (blank, frozen or noise): the ls0xx is write-only and unpowered, so no readback exists, and no camera sees the keyboard; it feeds #621's ext-power decision, not a pass/fail"

[[residual]]
id = "right-unplug"
replaces = []
kind = "hands, only if RA5 never ran"
needs_eyes = "no lab can cut USB power: RA5 runs by itself whenever the right is found on its battery; if it hasn't by the 0.2 cut, one unplug of the right's cable, and the case does the rest"

[[residual]]
id = "exclusive-fullscreen"
replaces = []
kind = "a report, not a step"
needs_eyes = "HA5's stand-in is a borderless window; an exclusive DXGI full-screen game can't be captured with GDI, so a flicker the user still sees in a real game after HA5 passes reopens #586"
