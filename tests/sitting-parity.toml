# Sitting parity (#618 theme C, #617): every step of the next sitting's script maps to what an
# agent can run or read without the user, or is tagged needs_eyes with the reason a person has
# to act or look. scripts/test_sitting_parity.py (in the gate) fails when a step of
# docs/release-notes/0.2.md "Known untested items" or a #90 row has no entry here, and when an
# entry names an API method, CLI or foxglove-lab command, HIL case, simulator test, script or
# log line that doesn't exist. Keep it honest: only what the code has today.
#
# Per step:
#   match       a piece of the step's text in 0.2.md (exactly one step), or
#   row         a #90 row letter (see [queue] below), or
#   batch       a step id of the resumed sitting's re-cut (docs/test-lab/sitting-0.2-h-i-r.md):
#               a user step (H1) needs a needs_eyes reason, an agent step (HA1) checks only
#   api         local API methods (crates/plugin-api METHODS)
#   cli         foxglove-cli commands
#   lab         foxglove-lab commands (kebab-case)
#   hil         tests/hil suite/case
#   sim         tests/zmk-sim tests
#   script      scripts an agent runs (lab scripts launch the app: On-call's OK first)
#   log         pieces of `Foxglove…` log lines the step's writes or events print
#   needs_eyes  why a person must act or look for (part of) the step; such steps are the
#               follow-up candidates for more API, readback or log coverage
#   replaces    (re-cut agent steps) the former user steps of the sitting it does instead
#
# [former] lists the re-cut's former user steps (#618: the sitting went from 18 user steps to 0);
# each is replaced by exactly one agent step or kept in exactly one [[residual]] entry: what
# truly can't be automated, with why (`needs_eyes`), and what it is (`kind`). No residual is a
# step of the sitting.
#
# Print the needs-eyes list: python scripts/test_sitting_parity.py --list

schema = 1

# #90's rows as of 2026-10-28 (the issue isn't in the repo). Update with #90.
[queue]
A = "Foxglove walkthrough"
B = "Cable reconnect + typing"
D = "Minisign keys for plugins"
E = "K5 Pro read-only check"
F = "GA build check"
G = "LampArray sitting"
H = "Plugins tab look"
I = "Windows atom-table leak"
L = "0.1 MSI install/upgrade/uninstall"
M = "SignalRGB sideload"
N = "Legacy Logitech Options memory leak"
O = "Corsair iCUE mirror"

# --- Keyboard: link, power and flashing ---

[[step]]
match = "Update the right hands-free with a left on this build"
lab = ["bootloader", "build"]
script = ["scripts/flash/foxglove_flash.py"]
note = "On-call's test-and-revert flash; the flasher sees the drive appear and reads both builds back"

[[step]]
match = "Let the left go idle (lights off), then replug its cable"
api = ["lighting.state", "lighting.set_sync"]
lab = ["status"]
hil = ["screens/capture-both"]
log = ["lighting sync (right follows left)", "Keyboard connected ("]
needs_eyes = "hands: replug the left's cable with no key pressed, put the PC to sleep and wake it, plug the right's cable in"

[[step]]
match = "Replug the left cable with no key pressed: HELLO answers"
hil = ["resilience/replug-hello"]
log = ["Keyboard connected ("]
needs_eyes = "hands: the cable replug (the HELLO and redraw checks after it are agents')"

[[step]]
match = "Right half events: the right's cable in and out"
api = ["lighting.set_sync", "lighting.sync", "lighting.state"]
cli = ["sync"]
lab = ["status"]
log = ["lighting sync (right follows left)"]
needs_eyes = "hands: the right's cable in and out, a key on the right, a right reboot"

[[step]]
match = "A new left with an old right: one refused subscribe"
lab = ["status", "build"]
script = ["scripts/flash/foxglove_flash.py"]
needs_eyes = "hands: updating across #543 may need one double-press on the right"

[[step]]
match = "The split link and re-link while a scene runs"
cli = ["facts"]
hil = ["resilience/r5a-split-drop-mid-relay"]
log = ["scene {name} started"]
needs_eyes = "no API or CLI call starts a scene (Scenes page only); the right's deep sleep needs it on battery for hours"

[[step]]
match = "Underglow brightness by power"
sim = ["battery-dim"]
lab = ["status"]
log = ["battery dim: "]
needs_eyes = "eyes and hands: how bright the right looks on battery against USB, and plugging its cable"

[[step]]
match = "Save battery switch and sliders on flashed #465 firmware"
log = ["battery dim: ", "battery notice: "]
needs_eyes = "the Save battery switch and sliders have no API or CLI call; a USB plug-in on the right needs hands"

[[step]]
match = "The left half's own battery level and its change events"
cli = ["facts", "status"]
log = ["battery notice: "]

[[step]]
match = "The app on the keyboard in the USB-and-Bluetooth state"
cli = ["status", "facts"]
log = ["Keyboard connected ("]
needs_eyes = "hands: switching USB and Bluetooth and the replug (&out is never sent from the PC); the diagnostics label is UI"

[[step]]
match = "Update keyboard from the app: both halves, left first"
script = ["scripts/flash/foxglove_flash.py"]
lab = ["build"]
needs_eyes = "Update keyboard is a Settings button with no API or CLI call (the flasher is the agents' path)"

[[step]]
match = "`keyboard.*` facts: switch layers, unplug USB"
cli = ["facts"]
needs_eyes = "hands: holding a layer key and unplugging USB"

