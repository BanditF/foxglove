cli = ["light", "lights"]
log = ["zone colours of"]
needs_eyes = "eyes: the 45L is write-only, so whether the zone lit is seen (the readback is what Foxglove sent)"

[[step]]
match = "Light zone N blinks only that zone"
needs_eyes = "eyes: the blinks; Identify and the zone test have no API call"

[[step]]
