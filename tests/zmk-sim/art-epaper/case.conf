# The firmware's own art pace on an e-paper target (#842): the art-local board (module/
# art_local_sim.c) with its art target e-paper, partial refresh, a frame a second at most (v2
# descriptor). The real art_store.c, art_local.c, art_pace.c and host_link.c; the drawer prints
# the pace it would play each set at.
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_ART_LOCAL=y
CONFIG_FOXGLOVE_SIM_ART_EPAPER=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
