# The panel polarity (#666): the real panel_polarity.c and host_link.c (D7 12 / D7 92), with the
# drawers, the settings backend and the relay faked (module/polarity_sim.c). A reboot's load goes
# through settings_runtime_set, which calls the real settings handler as settings_load does.
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_POLARITY=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
