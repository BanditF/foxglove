# SET_EFFECT's key rings (#490): the host-effects case's real files and fakes (module/effects_sim.c)
# with its own driver, on a physical layout with the Eyelash Corne's key places
# (native_posix_64.keymap), so a key's place comes from ZMK as on the board.
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_EFFECTS=y
CONFIG_FOXGLOVE_SIM_KEY_RIPPLE=y
# rgb_idle.c keeps the user's on/off in the settings: none stored here, so it starts lit.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_ZMK_LOW_PRIORITY_WORK_QUEUE=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
