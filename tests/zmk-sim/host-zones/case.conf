# A per-key scene on a zone board (#611): the SET_FRAME reports the app sends for the Corne as its
# profile ships, through the real host_link.c and host_frames.c, with the strip and the art relay
# faked (module/frames_sim.c); module/zones_sim.c plays the app (app/src/foxglove/keyboard_zone_vectors.rs).
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_FRAMES=y
CONFIG_FOXGLOVE_SIM_ZONES=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
