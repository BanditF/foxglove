# The left's activity relay (#603): the real activity_relay.c on ZMK's real activity, with the
# relay replaced by a print of the op the right would get (module/activity_sim.c). Idle after 3 s
# and sleep after 20 s, so the case runs through every state; simulated time runs unslowed and
# sys_poweroff ends the run (SIM_SLEEP, module/stubs.c).
CONFIG_FOXGLOVE_SIM_ACTIVITY=y
CONFIG_ZMK_IDLE_TIMEOUT=3000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=20000
CONFIG_NATIVE_POSIX_SLOWDOWN_TO_REAL_TIME=n
CONFIG_FOXGLOVE_SIM_POWEROFF=y
CONFIG_FOXGLOVE_SIM_HOSTLINK=n
