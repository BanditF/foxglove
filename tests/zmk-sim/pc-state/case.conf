# The PC state (#609, #604): the real pc_state.c, host_link.c (D7 11 / D7 91), rgb_idle.c and
# activity_relay.c, with ZMK's underglow, the cable and the relay faked (module/pc_state_sim.c).
# ZMK's idle timeout is its default (30 s, as shipped: config/eyelash_corne.conf doesn't set it),
# the USB idle time the shield's default (module/CMakeLists.txt reads it), the deep sleep the
# production one (prod.keys). Simulated time runs unslowed; ZMK's sleep ends the run (SIM_SLEEP).
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_PC_STATE=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_ZMK_LOW_PRIORITY_WORK_QUEUE=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZMK_SLEEP=y
CONFIG_NATIVE_POSIX_SLOWDOWN_TO_REAL_TIME=n
CONFIG_FOXGLOVE_SIM_POWEROFF=y
