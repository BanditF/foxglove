# Deep sleep after the production idle timeout (#218, #223). The timeout itself comes from
# config/eyelash_corne.conf (prod.keys). Simulated time runs as fast as it can, so 30 minutes take
# moments, and sys_poweroff prints SIM_SLEEP and ends the run (module/stubs.c, module/sleep_sim.c).
CONFIG_ZMK_SLEEP=y
CONFIG_NATIVE_POSIX_SLOWDOWN_TO_REAL_TIME=n
CONFIG_FOXGLOVE_SIM_POWEROFF=y
# No host-link walk here: its POSITION presses would count as activity.
CONFIG_FOXGLOVE_SIM_HOSTLINK=n
