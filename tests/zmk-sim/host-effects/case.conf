# SET_EFFECT (#490): the real host_link.c, host_effects.c, effect_run.c, lamp_effect.c,
# host_frames.c and rgb_idle.c, with the strip, the art relay and ZMK's underglow faked
# (module/effects_sim.c). Frames draw on ZMK's low-priority queue, as on the board.
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_EFFECTS=y
# rgb_idle.c keeps the user's on/off in the settings: none stored here, so it starts lit.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
# Idle comes 3 s after the last activity (ZMK checks each second), so the case can wait it out.
CONFIG_ZMK_IDLE_TIMEOUT=3000
CONFIG_ZMK_LOW_PRIORITY_WORK_QUEUE=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
