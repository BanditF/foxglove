# rgb_idle's key-then-away race (#651 follow-up): the pc-state case's real pc_state.c, host_link.c
# (D7 11), rgb_idle.c and activity_relay.c with its fakes (module/pc_state_sim.c), driven by
# rgb_idle_race_sim_driver. A key's check (50 ms after it) must not take away's idle-off as the
# user's off: the user's on/off stays on, and the lights come back when the PC does.
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_PC_STATE=y
CONFIG_FOXGLOVE_SIM_RGB_IDLE_RACE=y
# rgb_idle.c keeps the user's on/off in the settings: none stored here, so it starts lit.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_ZMK_LOW_PRIORITY_WORK_QUEUE=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
