# A single-screen board's local art target (#834): the real art_store.c and art_local.c behind
# host_link.c (D6 straight to the store on this half, HELLO v2 bit 32 ART_LOCAL). The board's
# screens, drawer and flash slots are faked in module/art_local_sim.c, which plays the PC.
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_ART_LOCAL=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
