# The host-held modes' lease (#847): the real host_link.c (D7 15 / D7 95), art_keys.c and knob.c
# with the production keymap's &art_next and &knob (module/hold_lease_sim.c plays the PC, the art
# key and the encoder). Simulated time runs unslowed: the run covers several 30 s leases.
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_HOLD_LEASE=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NATIVE_POSIX_SLOWDOWN_TO_REAL_TIME=n
