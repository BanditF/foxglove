# The colour Swirl (#626): the real dim_strip.c, colour_effects.c, rgb_idle.c and host_link.c, with
# ZMK's underglow, the strip and the relay faked (module/colour_swirl_sim.c). The band and depth
# are the shield's shipped defaults (Kconfig.defconfig).
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_COLOUR_SWIRL=y
CONFIG_LED_STRIP=y
# rgb_idle.c keeps the user's on/off in the settings: none stored here, so it starts lit.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_ZMK_LOW_PRIORITY_WORK_QUEUE=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
# test_hooks.c's bootloader nonce.
CONFIG_TEST_RANDOM_GENERATOR=y
