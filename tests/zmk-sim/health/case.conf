# The keyboard's self-report (#705): the real health.c and host_link.c (D7 13 / D7 93), as the
# left of a one-piece keyboard (no relay here; relay-sim's health scenario covers the right and the
# relay counters). The Raw HID module's counters are faked (module/health_sim.c counts the reports).
CONFIG_FOXGLOVE_SIM_HOSTLINK=y
CONFIG_FOXGLOVE_SIM_HEALTH=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NATIVE_POSIX_SLOWDOWN_TO_REAL_TIME=n
