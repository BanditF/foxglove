schema = 1

# The app's own behaviour with the keyboard attached. Needs Foxglove running: use --allow-app.

[[cases]]
name = "art-select-builtin"
description = "Select built-in art set 1 on the right through the art relay, see the right report it, restore the previous set"
tags = ["app", "release"]
steps = [{ art_select = { set = 1 } }]

[[cases]]
name = "app-idle-cpu"
description = "Foxglove idle for 20 s with nothing pressed uses at most 60 ms CPU (0.3 % of one core; #100)"
tags = ["app", "release"]
steps = [{ idle_cpu = { seconds = 20, max_cpu_ms = 60 } }]
