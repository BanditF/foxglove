schema = 1
# app-idle first: its idle CPU case must not measure the other cases' traffic (#618).
include = ["app-idle.toml", "smoke.toml", "positions.toml", "screens.toml"]

[[cases]]
name = "typing-abc"
description = "Type abc into the runner-owned foreground window"
tags = ["release"]
steps = [{ type_into_sink = { text = "abc", expect = "abc", via = [
  { invoke = { behavior = "kp", param1 = 458756 } },
  { invoke = { behavior = "kp", param1 = 458757 } },
  { invoke = { behavior = "kp", param1 = 458758 } },
] } }]


[[cases]]
name = "manual-soft-off-wake"
description = "Human verifies soft-off and wake; runner sends no power commands"
tags = ["release"]
manual = true
steps = [{ prompt = { ask = "Hold ADMIN+M for 2 s: both halves should switch off. Then press each half's reset button ONCE (a double tap enters the bootloader). Answer y if both halves wake and type, n otherwise" } }]
