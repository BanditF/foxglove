schema = 1

# GA candidate gate (#81): run on a keyboard flashed with the GA UF2s of the release commit.
#   foxglove-lab run --suite ga --allow-app --non-interactive
# The test hooks must be compiled out and the safety refusals must hold. Only harmless requests
# are sent (POSITION releases Q; BOOTLOADER is ARM only; the refusals send BT_SEL/OUT to what
# is already selected and a 0 ms soft-off tap, which can't power off even if accepted). Set the
# SHA below with the release commit when running a real candidate (sha = "<7 hex>").
# The ZMK simulator runs the same assertions in tests/zmk-sim/hostlink-ga (Firmware engineer).

[[cases]]
name = "ga-build-both-halves"
description = "Both halves report profile GA (D7 09 BUILD_INFO)"
tags = ["ga", "release"]
requires = ["build_info"]
steps = [
  { expect_build = { half = "left", profile = "ga" } },
  { expect_build = { half = "right", profile = "ga" } },
]

[[cases]]
name = "ga-hello-no-test-hooks"
description = "HELLO: bits 5 (position) and 9 (bootloader) clear; 6, 7, 12 set; byte 30 = GA; split guard never dropped the link (byte 31 = 0)"
tags = ["ga", "release"]
steps = [{ expect_hello = { caps_clear = [5, 9], caps_set = [6, 7, 12], profile = "ga", guard_drops_max = 0 } }]

[[cases]]
name = "ga-position-not-built-in"
description = "D7 05 POSITION answers 4 (not built in)"
tags = ["ga", "release"]
steps = [{ expect_not_built_in = { command = "position" } }]

[[cases]]
name = "ga-bootloader-not-built-in"
description = "D7 08 BOOTLOADER ARM answers 4 (not built in)"
tags = ["ga", "release"]
steps = [{ expect_not_built_in = { command = "bootloader" } }]

[[cases]]
name = "ga-refusals"
description = "INVOKE refuses &bootloader, &sys_reset, &bt, &out and &soft_off with 6"
tags = ["ga", "release"]
requires = ["invoke_refusal", "build_info"]
steps = [
  { invoke = { behavior = "bootloader", expect_status = "refused" } },
  { invoke = { behavior = "sys_reset", expect_status = "refused" } },
  { invoke = { behavior = "bt", param1 = 3, param2 = 0, expect_status = "refused" } },
  { invoke = { behavior = "out", param1 = 1, param2 = 0, expect_status = "refused" } },
  { invoke = { behavior = "soft_off", expect_status = "refused" } },
]
