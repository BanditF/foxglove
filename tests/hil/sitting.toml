schema = 1

# The 0.2 sitting's agent steps (docs/test-lab/sitting-0.2-h-i-r.md, On-call's run list): what the
# user used to do by hand in batches H and R. Run each case on its own with --only; the
# game-layer cases run next to the user's Foxglove (--allow-app: it must see the layer to tell
# the wallpaper), the right-screen case with Foxglove quit (its scenes own the lights).

[[cases]]
name = "game-layer-on"
description = "Sitting H (old H2): turns the GAME layer on (&tog 3, a layer toggle: types nothing) so Foxglove tells the HUD wallpaper game mode on before the user starts a full-screen game (#586). The log then has 'wallpaper sync: sent to … game mode on' (scripts/lab/wallpaper_check.py game checks it). game-layer-off turns it off again"
tags = ["sitting"]
steps = [
  { invoke = { behavior = "tog", param1 = 3 } },
  { expect_layer = { active_contains = [3], within_ms = 2000 } },
]

[[cases]]
name = "game-layer-off"
description = "Sitting H, after the game: &tog 3 again, back to the base layer"
tags = ["sitting"]
steps = [
  { invoke = { behavior = "tog", param1 = 3 } },
  { expect_layer = { top = 0, within_ms = 2000 } },
]

[[cases]]
name = "right-redraw-after-select-while-idle"
description = "#613/#621 check 3 (the sitting's old R4-R6): a built-in SELECT made while the right's LEDs, and so its screen's power, are idle-off is drawn once the right wakes from a tap on the LEFT, with no key on the right. Needs both halves on a build with the right's redraw count (HELLO bit 25; main firmware since 1ebdf9d, not 13ff04b), the underglow on with sync on, and Foxglove quit. Selects ZMK_1 (set 0) while awake, taps the left's middle thumb (D7 05 pos 43, a layer key: types nothing), waits for the left's idle (both dark, up to 45 s), selects ZMK_2 (set 1) while dark, notes the redraw count once it holds, taps again: the right on within 2 s, the count up within 5 s, and the right's readback is ZMK_2 (status strip masked). Readback is LVGL's model: whether the panel looks clean is the sitting's R2 look. Leaves set 1 (ZMK_2) on the right"
tags = ["sitting", "screens"]
requires = ["right_redraws", "position_press", "screen_readback"]
steps = [
  { art_select = { set = 0, restore = false, replace_pushed = true } },
  { press_position = { pos = 43, state = "tap" } },
  { expect_rgb = { right_age_max_s = 2, left_on = true, right_on = true, within_ms = 3000 } },
  { expect_rgb = { right_age_max_s = 2, left_on = false, right_on = false, pc_away = true, within_ms = 45000 } },
  { art_select = { set = 1, restore = false } },
  { note_right_redraws = {} },
  { press_position = { pos = 43, state = "tap" } },
  { expect_rgb = { right_age_max_s = 2, right_on = true, within_ms = 2000 } },
  { expect_right_redraws = { at_least = 1, within_ms = 5000 } },
  { screen = { half = "right", golden = "golden/right-art-set1.png", mask = [
    { x = 0, y = 0, width = 68, height = 20 },
  ] } },
]
