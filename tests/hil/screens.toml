schema = 1

# Screen readback (D7 06/07, HELLO bit 6). Captures are portrait 68x160, as a person sees them.
# A screen case without its golden is BLOCKED and saves a candidate PNG; review it, then copy it
# to tests/hil/golden/ (masks keep the clock, battery and animations out of the comparison).

[[cases]]
name = "capture-both"
description = "Capture both screens for the report (evidence, no comparison)"
tags = ["screens", "release"]
steps = [{ capture_screen = { half = "left" } }, { capture_screen = { half = "right" } }]

[[cases]]
name = "left-follows-layer"
description = "Holding the NUMBER thumb changes the left screen within 1 s (layer indicator)"
tags = ["screens", "release"]
requires = ["position_press"]
steps = [
  { capture_screen = { half = "left" } },
  { press_position = { pos = 43, state = "down" } },
  { expect_screen_change = { half = "left", within_ms = 1000 } },
  { press_position = { pos = 43, state = "up" } },
]

[[cases]]
name = "left-clock-ticks"
description = "The left screen changes within 65 s with nothing pressed (the clock's minute tick)"
tags = ["screens"]
steps = [{ expect_screen_change = { half = "left", within_ms = 65000 } }]

[[cases]]
name = "left-base-golden"
description = "Left screen on the base layer, USB connected, matches its golden (#177 profile boxes; clock and battery masked)"
tags = ["screens", "release"]
# Masked: the status row (battery, USB/BLE) and the PC panel below the divider at y 104 (clock,
# volume, media title), which change on their own. The profile boxes and the USB state stay in.
steps = [{ screen = { half = "left", golden = "golden/left-base.png", mask = [
  { x = 0, y = 0, width = 68, height = 16 },
  { x = 0, y = 105, width = 68, height = 55 },
] } }]

[[cases]]
name = "left-system-golden"
description = "Holding SYSTEM inverts the profile box and shows the SYSTEM tab (#177)"
tags = ["screens", "release"]
requires = ["position_press"]
steps = [
  { press_position = { pos = 43, state = "down" } },
  { press_position = { pos = 46, state = "down" } },
  { press_position = { pos = 0, state = "down" } },
  { expect_layer = { active_contains = [6] } },
  { screen = { half = "left", golden = "golden/left-system.png", mask = [
    { x = 0, y = 0, width = 68, height = 16 },
    { x = 0, y = 105, width = 68, height = 55 },
  ] } },
  { press_position = { pos = 0, state = "up" } },
  { press_position = { pos = 46, state = "up" } },
  { press_position = { pos = 43, state = "up" } },
  { expect_layer = { top = 0 } },
]

[[cases]]
name = "right-art-select-golden"
description = "#613: a built-in SELECT redraws the right screen with that set. The firmware has one built-in since #671 (Bandit_Emblem, set 0), so the case first pushes a bundled set (fury.bin, RAM only) to have another picture on screen, then selects set 0 and compares the right's readback (D7 06/07 through the relay) with the set's frames rendered from custom_art.c (golden/right-art-set0.png and its -fN frames: the emblem animates, so any frame matches; the capture is retried for up to 5 s while the redraw settles, as right after a flash); the status strip (portrait y 0-19) is masked. Readback is LVGL's own image, not the panel's pixels: noise from a panel power cycle needs eyes (On-call). Leaves set 0 on the right. Replaces pushed art (replace_pushed): the app re-sends its own when it next applies it. With the app running (--allow-app) the select goes through the app API art.select, read back with D6 STATUS and art.status, since the app puts its pinned set back after a direct SELECT (#622); with the app quit, the direct SELECT. Each step says which path it took"
tags = ["screens", "art", "release"]
requires = ["screen_readback"]
steps = [
  { art_push = { blob = "app/resources/lighting/art/fury.bin", expect_left_state = 3, expect_right_state = 2, within_ms = 60000 } },
  { art_select = { set = 0, restore = false, replace_pushed = true } },
  { screen = { half = "right", golden = "golden/right-art-set0.png", any_frame = true, within_ms = 5000, mask = [
    { x = 0, y = 0, width = 68, height = 20 },
  ] } },
]
