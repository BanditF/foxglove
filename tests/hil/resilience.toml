schema = 1

# Keyboard first (docs/resilience.md, #25): what the keyboard does when the PC side dies or
# misbehaves mid-push or mid-frame. Quit Foxglove first (it would fight the pushes and the panel).
# Rows 1 and 2a need the app or a fresh boot: scripts/lab/resilience.py. Rows 3, 4 and 5b are
# human (#90). Row 5a needs a dev build (D7 0B); it is BLOCKED on GA.
# replug-hello (#374) is the exception: it needs Foxglove running and a fresh run after a human replug. Pushes leave test art on the
# right; the last case puts a built-in set back (Foxglove re-pushes its own art when it starts).

# right-follows-left-activity runs first (#618): its 1 s wake limit is a timing check, and in the
# release gate it failed after the app stage and this suite's pushes, floods and link drops
# (the relay read of the right 6 s old) while it passed run alone (986 ms). The gate runs this
# suite before the app stages, once the app process has exited; its art_select waits for the
# left's relay to leave any other job first (on the art reports, no timed reads).

[[cases]]
name = "right-follows-left-activity"
description = "#603, #605 (PR 4 of #618): the right's art and underglow follow the left's idle and wake at once, with no key on the right. Needs both halves on a build with the activity relay (HELLO bit 23 says the left has it; a right without it fails the last step), the underglow on with sync on (the right follows the left), and Foxglove quit (its scenes own the lights). Selects animated built-in set 3 (Bandit_Gem, 4 fps) and taps the left's middle thumb (D7 05 pos 43, a layer key: types nothing) so both are lit; tells the keyboard the PC is away (D7 11, pc_away: #651's firmware holds a plugged-in keyboard lit while the PC is awake; the case's end puts the PC state back) and waits for the left's idle (RGB_STATE: both off, up to 45 s); the right's art must then hold still for 3 s (the right idles on its own: not kept awake); a second tap on the left must bring RGB_STATE's right on within 1 s and the right's art moving within 3 s (each right capture is a relay round trip; the step reports the ms). Before this fix the art stayed still until a right key. Leaves set 3 on the right; r-cleanup-built-in-art puts set 0 back"
tags = ["resilience"]
requires = ["activity_relay", "position_press", "screen_readback"]
steps = [
  { art_select = { set = 3, restore = false, replace_pushed = true } },
  { press_position = { pos = 43, state = "tap" } },
  { expect_rgb = { right_age_max_s = 2, left_on = true, right_on = true, within_ms = 3000 } },
  { expect_rgb = { right_age_max_s = 2, left_on = false, right_on = false, pc_away = true, within_ms = 45000 } },
  { expect_screen_still = { half = "right", region = { x = 0, y = 20, width = 68, height = 140 }, ms = 3000 } },
  { press_position = { pos = 43, state = "tap" } },
  { expect_rgb = { right_age_max_s = 2, right_on = true, within_ms = 1000 } },
  { expect_screen_change = { half = "right", region = { x = 0, y = 20, width = 68, height = 140 }, within_ms = 3000 } },
]

[[cases]]
name = "r2b-push-stops-mid-usb"
description = "2b: BEGIN and a few DATA, then silence (app killed while sending). After ~10 s the left drops it (state 0, error 8); the right keeps its set; a new push works"
tags = ["resilience"]
steps = [
  { art_push = { blob = "app/resources/lighting/art/fury.bin", cut = "data", expect_left_state = 0, expect_errors = [8], right_keeps_set = true, within_ms = 20000 } },
  { art_push = { blob = "app/resources/lighting/art/fury.bin", expect_left_state = 3, expect_right_state = 2, within_ms = 60000 } },
]

[[cases]]
name = "r2c-silence-after-commit"
description = "2c: the app goes silent right after COMMIT; the left finishes the push on its own and the right plays the new set"
tags = ["resilience"]
steps = [
  { art_push = { blob = "app/resources/lighting/art/hearth.bin", cut = "commit", expect_left_state = 3, expect_right_state = 2, within_ms = 60000 } },
]

[[cases]]
name = "r2d-stuck-then-new-push"
description = "2d: a stuck receive, then within 10 s a full push; the new BEGIN replaces the stuck one and the push succeeds"
tags = ["resilience"]
steps = [
  { art_push = { blob = "app/resources/lighting/art/fury.bin", cut = "data", expect_left_state = 1, within_ms = 3000 } },
  { art_push = { blob = "app/resources/lighting/art/moon-garden.bin", expect_left_state = 3, expect_right_state = 2, within_ms = 60000 } },
]

[[cases]]
name = "r5a-split-drop-mid-relay"
description = "5a: the split link drops while the left pushes to the right (D7 0B); the push fails cleanly (state 4, error 6 or 1), the relay comes back (wait_relay, up to 60 s: ZMK reconnects, encryption, the 15 s discovery delay, then discovery at the right's slave latency; the soak saw 16.8 s), the right types again, and a new push works"
tags = ["resilience"]
requires = ["position_press"]
steps = [
  { art_push = { blob = "app/resources/lighting/art/fury.bin", drop_link = true, expect_left_state = 4, expect_errors = [6, 1], within_ms = 30000 } },
  { wait_relay = { within_ms = 60000 } },
  { press_position = { pos = 46, state = "down" } },
  { expect_layer = { active_contains = [2], within_ms = 2000 } },
  { press_position = { pos = 46, state = "up" } },
  { expect_layer = { top = 0 } },
  { art_push = { blob = "app/resources/lighting/art/constellations.bin", expect_left_state = 3, expect_right_state = 2, within_ms = 90000 } },
]

[[cases]]
name = "r5c-bad-crc"
description = "5c: BEGIN announces a CRC the data doesn't match; the left refuses it (state 4, error 5) and the right keeps its set"
tags = ["resilience"]
steps = [
  { art_push = { blob = "app/resources/lighting/art/fury.bin", corrupt = "crc", expect_left_state = 4, expect_errors = [5], right_keeps_set = true, within_ms = 15000 } },
]

[[cases]]
name = "r5c-bad-header"
description = "5c: a valid CRC but a broken header (wrong width); the right rejects it (left state 4, error 7) and keeps its set"
tags = ["resilience"]
steps = [
  { art_push = { blob = "app/resources/lighting/art/hearth.bin", corrupt = "header", expect_left_state = 4, expect_errors = [7], right_keeps_set = true, within_ms = 30000 } },
]

[[cases]]
name = "r6-flood"
description = "6: panel frames as fast as the link takes them for 60 s with NUMBER pressed every 2 s; the layer follows every time, and afterwards the left keeps the last frame"
tags = ["resilience"]
requires = ["position_press", "screen_readback"]
steps = [
  { panel_flood = { seconds = 60, save = "%TEMP%/foxglove-resilience-flood.pbm" } },
  { panel_dump = { path = "%TEMP%/foxglove-resilience-flood.pbm", within_ms = 4000 } },
]

[[cases]]
name = "r7-release"
description = "7: a frame is shown and kept; PANEL RELEASE brings the firmware's own panel back right away"
tags = ["resilience"]
requires = ["screen_readback"]
steps = [
  { panel_show = { pattern = 3, save = "%TEMP%/foxglove-resilience-frame.pbm" } },
  { panel_dump = { path = "%TEMP%/foxglove-resilience-frame.pbm", within_ms = 4000 } },
  { panel_release = {} },
  { panel_dump = { path = "%TEMP%/foxglove-resilience-frame.pbm", shown = false, within_ms = 3000 } },
]

[[cases]]
name = "replug-hello"
description = "#350/#374: right after the left half's cable is unplugged and plugged back in (a human step, #90), with no key pressed: the left answers HELLO, and its screen (D7 06/07 readback) shows the frame Foxglove last sent, so the app redrew the panel. A replug ends a lab run, so run this case on its own after the replug, with Foxglove started with FOXGLOVE_DUMP_PANEL=%TEMP%/foxglove-replug-panel.pbm: foxglove-lab --allow-app run --suite tests/hil/resilience.toml --only replug-hello. BLOCKED while the PC is locked (the app hands the panel back while away, #410)"
tags = ["resilience"]
manual = true
requires = ["screen_readback", "unlocked"]
steps = [
  { prompt = { ask = "Was the left half's cable unplugged and plugged back in just before this run, with no key pressed since? (y/n)" } },
  { expect_hello = { caps_set = [6] } },
  { panel_dump = { path = "%TEMP%/foxglove-replug-panel.pbm", within_ms = 4000 } },
]

[[cases]]
name = "rgb-state-follows-the-leds"
description = "#605 (PR 6b of #618): RGB_STATE's on/off is what each half's LEDs show, through an idle and a wake, and the right's comes within 1 s without a read. Needs both halves on a build with HELLO bit 24 (a right without it fails shown = true), the underglow on (the step turns it on: RGB_ON, a no-op when on) with sync on, and Foxglove quit (its scenes own the lights). Taps the left's middle thumb (D7 05 pos 43, a layer key: types nothing); RGB_STATE must report both halves lit from their shown blocks with the right on the left's look; tells the keyboard the PC is away (D7 11, pc_away: #651's firmware holds a plugged-in keyboard lit while the PC is awake; the case's end puts the PC state back) and waits for the left's idle (both dark, up to 45 s); a second tap must bring both back lit within 1 s. Proves the report follows the commanded on/off through idle and wake per half from the frames each half writes to its strip; it doesn't prove photons (a camera or the #90 queue does)"
tags = ["resilience"]
requires = ["rgb_shown", "position_press"]
steps = [
  # After r5a's drop the relay is back ~20 s later (reconnect, then discovery); the tap's 3 s
  # budget only counts once it is up.
  { wait_relay = { within_ms = 30000 } },
  { invoke = { behavior = "rgb_ug", param1 = 1 } },
  { press_position = { pos = 43, state = "tap" } },
  { expect_rgb = { right_age_max_s = 2, shown = true, left_on = true, right_on = true, right_same_look = true, within_ms = 3000 } },
  { expect_rgb = { right_age_max_s = 2, shown = true, left_on = false, right_on = false, pc_away = true, within_ms = 45000 } },
  { press_position = { pos = 43, state = "tap" } },
  { expect_rgb = { right_age_max_s = 2, shown = true, left_on = true, right_on = true, within_ms = 1000 } },
]

[[cases]]
name = "right-relink-keeps-the-lefts-look"
description = "#624/#625 (PR 6b of #618): after the right misses a change and re-links, both halves show the left's look; nothing the right had is taken by the left. Needs a dev build on both halves (D7 0B GUARD_TEST, HELLO bit 24), sync on, Foxglove quit. Sets the underglow on, hue 200 sat 90 bri 20, Swirl; both halves must report that. Then the split guard drops the link and, while HELLO shows it down (right link 0), sets hue 39 sat 70 bri 42 on the left only (the right misses it, as a rebooted right with an older save would). After the relay is back, RGB_STATE must show the left on 39/70/42 Swirl and the right on the same within 10 s. Before the fix the right kept 200/90/20 (only on/off followed). Ends on 39/70/42, a look of the test's own: foxglove-lab saves the lights when a suite starts and puts them back when it ends, also after a failure or Ctrl-C (src/lights.rs), so nobody restores by hand"
tags = ["resilience"]
requires = ["rgb_shown"]
steps = [
  { invoke = { behavior = "rgb_ug", param1 = 1 } },
  { invoke = { behavior = "rgb_ug", param1 = 14, param2 = 13130260 } },
  { invoke = { behavior = "rgb_ug", param1 = 13, param2 = 3 } },
  { expect_rgb = { right_age_max_s = 2, left_look = { hue = 200, sat = 90, brightness = 20, effect = 3 }, right_same_look = true, within_ms = 5000 } },
  { split_guard_test = { within_ms = 90000, while_down = { behavior = "rgb_ug", param1 = 14, param2 = 2573866 } } },
  { expect_rgb = { right_age_max_s = 2, shown = true, left_look = { hue = 39, sat = 70, brightness = 42, effect = 3 }, right_same_look = true, within_ms = 10000 } },
]

[[cases]]
name = "r-cleanup-built-in-art"
description = "Puts a built-in set back on the right (the pushes left test art)"
tags = ["resilience"]
steps = [{ art_select = { set = 0, restore = false, replace_pushed = true } }]

[[cases]]
name = "right-redraw-after-wake"
description = "#613/#621 (PR 8 of #618): an idle-off then wake rewrites the whole right panel. Screen readback is LVGL's model and can't see noise from the panel's power cut, so this reads the right's whole-screen rewrite count instead (D7 8E bytes 16-20, HELLO bit 25; both halves on a build with it). Needs the underglow on with sync on (the right's panel power follows the left's lights) and Foxglove quit (its scenes own the lights). Taps the left's middle thumb (D7 05 pos 43, a layer key: types nothing), tells the keyboard the PC is away (D7 11, pc_away: #651's firmware holds a plugged-in keyboard lit while the PC is awake; the case's end puts the PC state back) and waits for the left's idle (RGB_STATE: both off, up to 45 s), notes the count once it holds for 1.2 s, taps again: RGB_STATE's right on within 2 s, and the count up by at least 1 within 5 s. Whether the panel looks clean still needs eyes or a camera once (the count proves the rewrite ran)"
tags = ["resilience", "release"]
requires = ["right_redraws", "position_press"]
steps = [
  { press_position = { pos = 43, state = "tap" } },
  { expect_rgb = { right_age_max_s = 2, left_on = true, right_on = true, within_ms = 3000 } },
  { expect_rgb = { right_age_max_s = 2, left_on = false, right_on = false, pc_away = true, within_ms = 45000 } },
  { note_right_redraws = {} },
  { press_position = { pos = 43, state = "tap" } },
  { expect_rgb = { right_age_max_s = 2, right_on = true, within_ms = 2000 } },
  { expect_right_redraws = { at_least = 1, within_ms = 5000 } },
]
