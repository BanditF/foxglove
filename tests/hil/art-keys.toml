schema = 1

# Art keys (#302): &art_next / &art_prev on SYSTEM + P / O. Quit Foxglove first (it may take the
# keys over). The opt-in ending on a USB unplug is a human step (#90); the lab's link can't unplug.

[[cases]]
name = "art-keys-advertised"
description = "HELLO capability bit 16 (ART_KEYS) is set"
tags = ["art-keys"]
steps = [{ expect_hello = { caps_set = [16] } }]

[[cases]]
name = "art-keys-board-steps"
description = "No app opt-in (D7 0D 00 first, in case a killed app left it on): SYSTEM+P steps the right-screen art forward and SYSTEM+O back, on the board itself"
tags = ["art-keys"]
requires = ["art_keys", "position_press"]
steps = [
  { press_position = { pos = 43, state = "down" } },
  { press_position = { pos = 46, state = "down" } },
  { press_position = { pos = 0, state = "down" } },
  { expect_layer = { active_contains = [6], retrigger = 0 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 10 } },
  { press_position = { pos = 0, state = "up" } },
  { press_position = { pos = 46, state = "up" } },
  { press_position = { pos = 43, state = "up" } },
  { expect_layer = { top = 0 } },
]

[[cases]]
name = "art-keys-long-hold-cycles"
description = "#851 after #867 (the c9bf83b trace): SYSTEM held through ten SYSTEM+P steps, then ten SYSTEM+O steps, every press steps (two laps each way on the emblem plus 4 kept places, wraps included). The layer keys stay down about 18 s each way, past the old 10 s test-hook release that dropped SYSTEM mid-cycle (forward: the 6th tap refused busy_or_no_relay; back: the 7th stepped nothing). Needs firmware with #851's hold fix on both halves (held while the PC keeps talking, up to 60 s), no app opt-in, Foxglove quit"
tags = ["art-keys"]
requires = ["art_keys", "position_press"]
steps = [
  { press_position = { pos = 43, state = "down" } },
  { press_position = { pos = 46, state = "down" } },
  { press_position = { pos = 0, state = "down" } },
  { expect_layer = { active_contains = [6], retrigger = 0 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 11 } },
  { art_key = { pos = 10 } },
  { art_key = { pos = 10 } },
  { art_key = { pos = 10 } },
  { art_key = { pos = 10 } },
  { art_key = { pos = 10 } },
  { art_key = { pos = 10 } },
  { art_key = { pos = 10 } },
  { art_key = { pos = 10 } },
  { art_key = { pos = 10 } },
  { art_key = { pos = 10 } },
  # After ~36 s of held layer keys the first layer report can be slow (the #678 "no layer
  # report" flake): the last checks get a longer settle.
  { expect_layer = { active_contains = [6], within_ms = 3000, retrigger = 0 } },
  { press_position = { pos = 0, state = "up" } },
  { press_position = { pos = 46, state = "up" } },
  { press_position = { pos = 43, state = "up" } },
  { expect_layer = { top = 0, within_ms = 3000 } },
]

[[cases]]
name = "art-keys-board-visits-all-kept"
description = "#851: with Foxglove quit, the board's own step visits the emblem and every kept place in order, then wraps. Needs the emblem (set 0) plus exactly 4 kept places in slots 0-3 (sets 1-4; Screens shows Kept: 4 of 8), no app opt-in, and #851's step fix on the left. From the emblem: P lands on 1, 2, 3, 4, 0, 1 (the step after the wrap), then O lands on 0, 4, 3, 2, 1, 0. A press that lands anywhere else names the set it got"
tags = ["art-keys"]
requires = ["art_keys", "position_press"]
steps = [
  { art_select = { set = 0, restore = false } },
  { press_position = { pos = 43, state = "down" } },
  { press_position = { pos = 46, state = "down" } },
  { press_position = { pos = 0, state = "down" } },
  { expect_layer = { active_contains = [6], retrigger = 0 } },
  { art_key = { pos = 11, lands_on = 1 } },
  { art_key = { pos = 11, lands_on = 2 } },
  { art_key = { pos = 11, lands_on = 3 } },
  { art_key = { pos = 11, lands_on = 4 } },
  { art_key = { pos = 11, lands_on = 0 } },
  { art_key = { pos = 11, lands_on = 1 } },
  { art_key = { pos = 10, lands_on = 0 } },
  { art_key = { pos = 10, lands_on = 4 } },
  { art_key = { pos = 10, lands_on = 3 } },
  { art_key = { pos = 10, lands_on = 2 } },
  { art_key = { pos = 10, lands_on = 1 } },
  { art_key = { pos = 10, lands_on = 0 } },
  { expect_layer = { active_contains = [6], within_ms = 3000, retrigger = 0 } },
  { press_position = { pos = 0, state = "up" } },
  { press_position = { pos = 46, state = "up" } },
  { press_position = { pos = 43, state = "up" } },
  { expect_layer = { top = 0, within_ms = 3000 } },
]

[[cases]]
name = "art-keys-app-opt-in"
description = "With D7 0D 01: SYSTEM+P / O send D7 8D 01 01 / FF and the art stays put; the opt-in is ended after"
tags = ["art-keys"]
requires = ["art_keys", "position_press"]
steps = [
  { press_position = { pos = 43, state = "down" } },
  { press_position = { pos = 46, state = "down" } },
  { press_position = { pos = 0, state = "down" } },
  { expect_layer = { active_contains = [6], retrigger = 0 } },
  { art_key = { pos = 11, subscribed = true } },
  { art_key = { pos = 10, subscribed = true } },
  { press_position = { pos = 0, state = "up" } },
  { press_position = { pos = 46, state = "up" } },
  { press_position = { pos = 43, state = "up" } },
  { expect_layer = { top = 0 } },
]

[[cases]]
name = "art-keys-unplug-check"
description = "The USB-unplug follow-up: run it alone (--only art-keys-unplug-check) after art-keys-opt-in-for-replug and an unplug of the left USB. As art-keys-board-steps, but without D7 0D 00 first, so it passes only if the unplug ended the opt-in"
tags = ["art-keys", "manual-follow-up"]
requires = ["art_keys", "position_press"]
steps = [
  { press_position = { pos = 43, state = "down" } },
  { press_position = { pos = 46, state = "down" } },
  { press_position = { pos = 0, state = "down" } },
  { expect_layer = { active_contains = [6], retrigger = 0 } },
  { art_key = { pos = 11, keep_found_opt_in = true } },
  { art_key = { pos = 10 } },
  { press_position = { pos = 0, state = "up" } },
  { press_position = { pos = 46, state = "up" } },
  { press_position = { pos = 43, state = "up" } },
  { expect_layer = { top = 0 } },
]

[[cases]]
name = "art-keys-opt-in-for-replug"
description = "Opt in and leave it on, for the USB-unplug check: after the left's USB is unplugged and plugged back, art-keys-unplug-check must pass (the opt-in ended)"
tags = ["art-keys", "manual-follow-up"]
requires = ["art_keys", "position_press"]
steps = [
  { press_position = { pos = 43, state = "down" } },
  { press_position = { pos = 46, state = "down" } },
  { press_position = { pos = 0, state = "down" } },
  { expect_layer = { active_contains = [6], retrigger = 0 } },
  { art_key = { pos = 11, subscribed = true, keep_opt_in = true } },
  { press_position = { pos = 0, state = "up" } },
  { press_position = { pos = 46, state = "up" } },
  { press_position = { pos = 43, state = "up" } },
  { expect_layer = { top = 0 } },
]
