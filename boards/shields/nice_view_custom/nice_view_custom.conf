# Enable nice!view
CONFIG_ZMK_DISPLAY=y
# Disable idle blanking
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# LVGL's task handler: ZMK runs it every 10 ms while the display is on, and blanking is off so the
# screens keep showing. Our animations run at <= 4 fps and the host panel at 2 Hz, so 50 ms is
# plenty and wakes the CPU 5x less on both halves (#218). A Kconfig default can't do this: ZMK's
# own default comes first.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=50
