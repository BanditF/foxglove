name: Foxglove app
# The app in app/ (KeyPeek absorbed) has its own Cargo workspace. app/.github holds upstream
# KeyPeek's workflows; GitHub doesn't run those from a subfolder, they're kept for syncing.
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "crates/digitalis/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "crates/digitalis/**"
      - ".github/workflows/app.yml"

defaults:
  run:
    working-directory: app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: foxglove-windows
          path: app/target/release/foxglove.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libglib2.0-dev libgtk-3-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf-2.0-dev libcairo2-dev libxdo-dev libxdo3 libwayland-dev libegl1-mesa-dev libxkbcommon-dev
      - run: cargo test
