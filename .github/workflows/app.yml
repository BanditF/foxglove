name: Foxglove app
# The app in app/ (KeyPeek absorbed) has its own Cargo workspace. app/.github holds upstream
# KeyPeek's workflows; GitHub doesn't run those from a subfolder, they're kept for syncing.
# Runs by hand or on app release tags; the gate is
# scripts/check.ps1, run locally before pushing.
on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'A throwaway test build (MAJOR.MINOR.PATCH): the exe and MSI get this version, uploaded only as a workflow artifact named for it. Never a release.'
        required: false
        default: ''
  push:
    tags:
      - 'app-v*'

defaults:
  run:
    working-directory: app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Match executable version to release tag (or the test version)
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.test_version != ''
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          $version = if ($env:TEST_VERSION) { $env:TEST_VERSION } else { $env:TAG -replace '^app-v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use app-vMAJOR.MINOR.PATCH' }
          $manifest = Get-Content Cargo.toml -Raw
          $manifest = [regex]::Replace($manifest, '(?m)^version = "[^"]+"', "version = `"$version`"", 1)
          Set-Content Cargo.toml $manifest
      - run: cargo build --release
      - name: Install packaging tools
        run: |
          choco install wixtoolset --version=3.14.1 -y --no-progress
          cargo install cargo-wix --version 0.3.8 --locked
      - name: Build MSI
        shell: pwsh
        env:
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          $env:PATH = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin;$env:PATH"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^app-v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use an app-vMAJOR.MINOR.PATCH tag' }
            cargo wix --no-build --nocapture --install-version $version --output target/wix/foxglove-x64.msi
          } elseif ($env:TEST_VERSION) {
            cargo wix --no-build --nocapture --install-version $env:TEST_VERSION --output target/wix/foxglove-x64.msi
          } else {
            cargo wix --no-build --nocapture --output target/wix/foxglove-x64.msi
          }
          if ($LASTEXITCODE) { throw 'MSI build failed' }
          # cargo-wix's --version prints its own version and succeeds, so check the MSI is there.
          if (-not (Test-Path target/wix/foxglove-x64.msi)) { throw 'No MSI was built' }
      - uses: actions/upload-artifact@v4
        with:
          # A test build's artifact is named for it, so it can't be mistaken for a release's.
          name: foxglove-windows${{ inputs.test_version != '' && format('-{0}-test', inputs.test_version) || '' }}
          path: |
            app/target/release/foxglove.exe
            app/target/wix/foxglove-x64.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require update signing key
        working-directory: .
        env:
          FOXGLOVE_UPDATE_KEY: ${{ secrets.FOXGLOVE_UPDATE_KEY }}
        run: |
          if [ -z "$FOXGLOVE_UPDATE_KEY" ]; then
            echo "::error::FOXGLOVE_UPDATE_KEY is required; refusing to publish unsigned update metadata"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: foxglove-windows
          path: dist
      - name: Attach installer and executable to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          FOXGLOVE_UPDATE_KEY: ${{ secrets.FOXGLOVE_UPDATE_KEY }}
        working-directory: dist
        run: |
          if ! gh release view "$TAG"; then
            gh release create "$TAG" --verify-tag --title "Foxglove $TAG" --generate-notes
          fi
          gh release view "$TAG" --json body --jq .body > notes.txt
          cargo run --locked --manifest-path ../Cargo.toml -p foxglove-update --bin foxglove-update-sign -- manifest --version "${TAG#app-v}" --msi wix/foxglove-x64.msi --url "https://github.com/$GH_REPO/releases/download/$TAG/foxglove-x64.msi" --notes-file notes.txt
          cargo run --locked --manifest-path ../Cargo.toml -p foxglove-update --bin foxglove-update-sign -- sign latest.json
          gh release upload "$TAG" release/foxglove.exe wix/foxglove-x64.msi latest.json latest.json.sig --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libglib2.0-dev libgtk-3-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf-2.0-dev libcairo2-dev libxdo-dev libxdo3 libwayland-dev libegl1-mesa-dev libxkbcommon-dev
      - run: cargo test
