name: Rust crates
# Runs by hand only (Actions tab); the gate is scripts/check.ps1, run locally before pushing.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The installed hub's build (no lab-switches): the crates that have the feature, lint and tests.
      - run: cargo clippy -p hideout -p hideout-registry -p hideout-router -p hideout-services -p hideout-shell -p hideout-supervisor --no-default-features --all-targets -- -D warnings
      - run: cargo test -p hideout -p hideout-registry -p hideout-router -p hideout-services -p hideout-shell -p hideout-supervisor --no-default-features --lib --bins --tests
      - run: cargo build -p foxglove-link --no-default-features
