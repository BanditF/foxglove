name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "keymap-drawer/**"
      # Desktop side and docs: no firmware in there.
      - "crates/**"
      - "app/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
      - ".github/workflows/app.yml"
      - "scripts/check.ps1"
      - "tests/**"
      - "scripts/**"
      - "lab-reports/**"
      - ".github/workflows/zmk-sim.yml"

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0
