[package]
name = "den"
version = "0.1.0"
edition = "2021"
description = "The Den: Foxglove's local API host, serving Kits and outside tools over any byte stream"
license = "MIT"

[dependencies]
base64 = "0.22"
foxglove-kit-api = { path = "../kit-api" }
palm = { path = "../palm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
