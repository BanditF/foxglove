[package]
name = "den"
version = "0.1.0"
edition = "2021"
description = "The Den: Foxglove's local API host, serving Kits and outside tools over any byte stream"
license = "MIT"

[dependencies]
base64 = "0.22"
foxglove-kit-api = { path = "../kit-api" }
palm = { path = "../palm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
