[package]
name = "kit-openrgb-e131"
version = "1.0.0"
edition = "2021"
description = "Foxglove Kit: OpenRGB (or any E1.31 sender) colours the keyboard's lights over localhost"
license = "MIT"

[[bin]]
name = "openrgb-e131"
path = "src/main.rs"

[dependencies]
foxglove-kit = { path = "../kit-sdk" }
serde_json = "1"

[dev-dependencies]
den = { path = "../den" }
foxglove-kit-api = { path = "../kit-api" }
palm = { path = "../palm" }
