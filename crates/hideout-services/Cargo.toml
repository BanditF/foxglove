[package]
name = "hideout-services"
version = "0.1.0"
edition = "2021"
description = "The Hideout hub's host services (contract §8.10, §8.11): the network broker (net.open, net.send, net.close) and the microphone (mic.* facts, audio.inputs.set_mute). Event-driven, never polling. Clean-room MIT."
license = "MIT"

[dependencies]
base64 = "0.22"
hideout-contract = { path = "../hideout-contract" }
hideout-router = { path = "../hideout-router" }
log = "0.4"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Core Audio for the microphone (§8.11). The same crates and features crates/info-screen
# already uses (MIT/Apache-2.0); the #[implement] macro (COM callbacks) names windows_core.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

# SO_EXCLUSIVEADDRUSE on the broker's loopback listens (#1107 review); windows-sys is already in
# the tree (MIT/Apache-2.0).
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
# The plugins' own code path: the SDK's net client (connect_tcp, listen_tcp, listen_udp) over an
# in-process hub.
foxglove-plugin = { path = "../plugin-sdk" }
hideout-contract = { path = "../hideout-contract" }
