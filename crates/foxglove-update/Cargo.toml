[package]
name = "foxglove-update"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "foxglove-update-sign"
path = "src/main.rs"
