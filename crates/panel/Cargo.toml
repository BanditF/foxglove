[package]
name = "foxglove-panel"
version = "0.1.0"
edition = "2021"
description = "The left screen's host panel: what it shows, where that comes from on Windows, and who may draw it"
license = "MIT"

[dependencies]
chrono = "0.4"
digitalis = { path = "../digitalis", default-features = false }
embedded-graphics = "0.8"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
