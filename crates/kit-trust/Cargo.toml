[package]
name = "kit-trust"
version = "0.1.0"
edition = "2021"
description = "Verifies Foxglove Kits: a pinned root key signs root.json, which names the keys that sign the Kit catalog; the catalog pins each Kit's archive hash and files"
license = "MIT"

[dependencies]
minisign-verify = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
minisign = "0.7"
