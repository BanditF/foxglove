[package]
name = "hideout"
version = "0.1.0"
edition = "2021"
description = "The Hideout hub (hideout.exe). Starts empty, with only the Modules page. Clean-room MIT."
license = "MIT"

[[bin]]
name = "hideout"
path = "src/main.rs"

[dependencies]
hideout-registry = { path = "../hideout-registry" }
hideout-router = { path = "../hideout-router" }
hideout-shell = { path = "../hideout-shell" }
hideout-supervisor = { path = "../hideout-supervisor" }
log = "0.4"
serde_json = "1"
