[package]
name = "hideout"
version = "0.1.0"
edition = "2021"
description = "The Hideout hub (hideout.exe). Starts empty, with only the Modules page. Clean-room MIT."
license = "MIT"

[[bin]]
name = "hideout"
path = "src/main.rs"

[dependencies]
hideout-appwatch = { path = "../hideout-appwatch" }
hideout-contract = { path = "../hideout-contract" }
hideout-registry = { path = "../hideout-registry" }
hideout-router = { path = "../hideout-router" }
hideout-services = { path = "../hideout-services" }
hideout-shell = { path = "../hideout-shell" }
hideout-supervisor = { path = "../hideout-supervisor" }
log = "0.4"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# The inventory change watch (#1012.4): FindFirstChangeNotificationW and its wait. Already in
# the tree through hideout-supervisor (MIT/Apache-2.0).
# WinHTTP (#1049): the catalog fetch over the OS's own HTTPS stack, so no new crate.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
# The catalog fetch tests sign their own catalogs with keys made per run (minisign, MIT).
foxglove-plugin-trust = { path = "../plugin-trust", features = ["sign"] }
