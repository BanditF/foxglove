[package]
name = "hideout"
version = "0.1.0"
edition = "2021"
description = "The Hideout hub (hideout.exe). Starts empty, with only the Modules page. Clean-room MIT."
license = "MIT"

[[bin]]
name = "hideout"
path = "src/main.rs"

[features]
# Lab mode, developer mode, unsigned sideload, the hub folder override and `--lab`: read from the
# environment and the command line only with this feature. On by default (the lab harness and
# On-call build `--release` and need it); the installer builds `-p hideout --no-default-features`
# (scripts/build-hideout-installer.ps1), so the installed hub ignores them.
default = ["lab-switches"]
lab-switches = [
    "hideout-registry/lab-switches",
    "hideout-router/lab-switches",
    "hideout-services/lab-switches",
    "hideout-shell/lab-switches",
    "hideout-supervisor/lab-switches",
]

[dependencies]
hideout-acl = { path = "../hideout-acl" }
hideout-appwatch = { path = "../hideout-appwatch" }
hideout-contract = { path = "../hideout-contract" }
hideout-registry = { path = "../hideout-registry", default-features = false }
hideout-router = { path = "../hideout-router", default-features = false }
hideout-services = { path = "../hideout-services", default-features = false }
hideout-shell = { path = "../hideout-shell", default-features = false }
hideout-supervisor = { path = "../hideout-supervisor", default-features = false }
foxglove-plugin = { path = "../plugin-sdk" }
foxglove-plugin-trust = { path = "../plugin-trust" }
sha2 = "0.10"
log = "0.4"
serde_json = "1"
# Add an app rewrites two keys of a service app file and keeps every other byte.
toml_edit = "0.23"

[target.'cfg(windows)'.dependencies]
# The inventory change watch (#1012.4): FindFirstChangeNotificationW and its wait. Already in
# the tree through hideout-supervisor (MIT/Apache-2.0).
# WinHTTP (#1049): the catalog fetch over the OS's own HTTPS stack, so no new crate.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time"] }

[dev-dependencies]
# The Settings > Developer tests swap the disk and cloud-sync probes for fakes.
hideout-registry = { path = "../hideout-registry", default-features = false, features = ["test-probes"] }
# The catalog fetch tests sign their own catalogs with keys made per run (minisign, MIT).
foxglove-plugin-trust = { path = "../plugin-trust", features = ["sign"] }
# The hand-over test talks to the app's real connection handler, not a canned reply.
foxglove-plugin-api = { path = "../plugin-api" }
foxglove-plugin-host = { path = "../plugin-host" }
