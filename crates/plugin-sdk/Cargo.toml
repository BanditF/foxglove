[package]
name = "foxglove-plugin"
version = "0.1.0"
edition = "2021"
description = "Write Foxglove plugins in Rust: the local API client over stdio, with a heartbeat and fact events"
license = "MIT"

[dependencies]
base64 = "0.22"
foxglove-plugin-api = { path = "../plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
