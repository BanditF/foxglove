[package]
name = "foxglove-plugin"
version = "0.3.0"
edition = "2021"
description = "Write Foxglove plugins in Rust: the local API client over stdio, with a heartbeat and fact events"
license = "MIT"

[dependencies]
base64 = "0.22"
foxglove-plugin-api = { path = "../plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
