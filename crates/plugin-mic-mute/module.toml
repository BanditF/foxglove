# Hideout's manifest (contract §4.10, v1.4): plugin.toml's keys plus the tile and the page.
# Foxglove reads plugin.toml; Hideout reads this file. Keep the shared keys the same.
id = "org.foxglove.mic-mute"
name = "Mic mute"
version = "1.0.0"
kind = "service"
family = "foxglove"
hub = "1.3"
transport = "stdio"
api = { foxglove = "1.2" }
run = ["mic-mute.exe"]
permissions = ["audio.inputs.read", "audio.inputs.mute", "devices.read", "lighting.write", "screens.write"]
description = "Shows whether your microphone is muted, red on the keyboard and MUTED on the keyboard's info screen, and mutes or unmutes it from a key. This is Windows' mute for the default communications microphone; apps can still mute themselves."

[[ui.panels]]
id = "tile"
slot = "tile"
title = "Mic mute"
icon = "mic"

[[ui.panels]]
id = "page"
slot = "page"
title = "Mic mute"
icon = "mic"

[[actions]]
id = "toggle"
name = "Mute or unmute the microphone"

[[actions]]
id = "mute"
name = "Mute the microphone"

[[actions]]
id = "unmute"
name = "Unmute the microphone"
