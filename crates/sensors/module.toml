# Hideout's manifest (contract §4.10). sensors.exe is a Hideout module over the router pipe: it
# registers `sensor.*` and samples only while the hub's `facts.demand` (§8.8, hub 1.5) says
# someone listens. The one read, `keyboard.game_mode`, only slows the sampling during a game.
id = "org.foxglove.sensors"
name = "PC sensors"
version = "0.1.0"
kind = "service"
family = "foxglove"
hub = "1.5"
run = ["sensors.exe"]
permissions = ["facts.write:sensor.*", "facts.read:keyboard.game_mode"]
provides = ["facts:sensor.*"]
description = "Publishes the PC's CPU, GPU and memory load and the GPU's temperature, clock, power and fan as facts, only while something is listening. It reads; it never controls anything."

# The tile is hidden until the user adds it (Edit tiles): its `when` names a fact nothing sets.
[[ui.panels]]
id = "tile"
slot = "tile"
title = "PC sensors"
icon = "chart"
when = "sensors.tile.default"

[[ui.panels]]
id = "page"
slot = "page"
title = "PC sensors"
icon = "chart"
