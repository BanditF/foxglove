id = "org.foxglove.focus-timer"
name = "Pomodoro"
version = "1.0.0"
api = "1.2"
run = ["focus-timer.exe"]
permissions = ["devices.read", "lighting.write", "screens.write", "facts.write:focus.*"]
provides = ["facts", "lighting-effect", "action"]
description = "Alternates 25 minutes of focus and 5 of rest, and colours your keyboard's lights red to focus and green to rest."

[[actions]]
id = "pause"
name = "Pause or resume"

[[actions]]
id = "reset"
name = "Start a new focus period"
