[package]
name = "plugin-focus-timer"
version = "1.0.0"
edition = "2021"
description = "Example Foxglove plugin: a focus timer that colours the underglow (red to focus, green to rest)"
license = "MIT"

[[bin]]
name = "focus-timer"
path = "src/main.rs"

[dependencies]
foxglove-plugin = { path = "../plugin-sdk" }

[dev-dependencies]
foxglove-plugin-host = { path = "../plugin-host" }
foxglove-plugin-api = { path = "../plugin-api" }
foxglove-devices = { path = "../devices" }
serde_json = "1"
