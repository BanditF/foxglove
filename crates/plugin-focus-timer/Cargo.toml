[package]
name = "plugin-focus-timer"
version = "1.0.0"
edition = "2021"
description = "Pomodoro, a Foxglove plugin: a focus timer on the left panel and the underglow"
license = "MIT"

[[bin]]
name = "focus-timer"
path = "src/main.rs"

[dependencies]
foxglove-plugin = { path = "../plugin-sdk" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
foxglove-plugin-host = { path = "../plugin-host" }
foxglove-plugin-api = { path = "../plugin-api" }
foxglove-devices = { path = "../devices" }
serde_json = "1"
