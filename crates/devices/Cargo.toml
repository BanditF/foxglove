[package]
name = "foxglove-devices"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Devices: portable device capabilities, events, facts and actors for Foxglove"
readme = "README.md"

[features]
mock = []
contract = []
# The hidapi enumeration and writer for PC and peripheral lighting (pc_lighting::hid).
hid = ["dep:hidapi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
hidapi = { version = "2.6", optional = true }
