# PC and peripheral lighting that Foxglove recognises by USB VID/PID (#423).
#
# One [[device]] per board. `protocol` names the driver in crates/devices/src/pc_lighting:
#   "omen-tracer"  HP OMEN case lighting board (TracerLED), static colour per zone
#   "witmod-lcd"   Witmod-firmware LCD pump caps (#614); a stub that sends nothing: the device
#                  reads as not controllable until its [device.witmod] `ring_op` is known
#   "none"         recognised, listed as not controllable yet
# Zones list only the parts that light up; `id` is the board's own zone number.
# Scenes' room map (#483), optional: `size` = [width, height] of the device's front in mm, and a
# zone's `position` = [x, y] in mm from that front's top-left corner (x right, y down). Zones
# without one are spread evenly over the front, top to bottom. A zone's `role` = "ambient"
# marks an area light (a case's interior light): scenes light it with the average of the
# device's other zones, fading in and out with them, instead of at its position ("point", the
# default).
# Capabilities, all optional: `color` = "none" | "on-off" | "single" | "per-zone" | "per-led"
# (per-zone when zones are listed), `effects` (onboard effect names; on a device Foxglove
# can't drive yet, the first is the one it shows on its own, and the page says so), `brightness`, and
# [[device.screen]] tables: width, height, depth (bits per pixel), fps, images, animations,
# stream (live frames from the PC).
# [device.calibration]: the model's default colour calibration (white-balance `gain`, `gamma`,
# `brightness`, optional `matrix` and `curve`), until the user calibrates their own unit on
# the Lights page. Neutral values change nothing.
# `calibration_hint` = "<id>", optional: the model's starting white balance for its first match
# on the Lights page (one of the [[calibration_hint]] tables at the end), so the white step
# starts close instead of at neutral. Unset, the entry uses its `kind`'s hint, if any;
# "none" uses no hint. A hint only starts a match: nothing a device shows changes until the
# user saves one.
# `kind` = "case" | "cooler" | "strip" | "peripheral" | "other" (the default): what the device
# is, for scenes' room map and the page. The catalog says it, not the driver.
# `shape` = "keyboard" | "case" | "cooler" | "strip" | "mouse" | "headset" | "controller" |
# "lamps", optional: how the device's thumbnail is drawn (#803), when its `kind` (or the kind
# Windows reports for a Dynamic Lighting device) doesn't say it well. A class, never a product:
# no device gets its own drawing.
# [[device.conflict]] tables, optional, one per app that drives the same device and may put its
# own colours back over Foxglove's (a vendor's lighting tool): `app` (its name on the page),
# `processes` (its exe names, matched exactly in any case; checked only with a scan) and an
# optional `hint` (how to remove it or turn it off, shown on hover). The page warns "{app} is
# running and may override Foxglove's colours on {device}" while one of them runs, and saved
# colours don't go back on that device when it arrives.
# `unconfirmed = true`, optional: the entry comes from a vendor's software, not from the device
# seen on real hardware.
# [device.witmod], for protocol "witmod-lcd" only: the cap's HID protocol as data. `usage_page`
# and `usage` (its vendor interface), `report_ids`, `input_len` and `output_len` (bytes),
# `claim_op` and `claim_every_ms` (how often the vendor's helper re-claims the cap), `ring_leds`,
# `fan_leds` (per chained fan), `fans`, and `ring_op`, the ring's colour command: unset while
# unknown. Zone ids: 1 is the ring, 2 the fans chained from the cap.
# Entries the user adds on the Lights page go to lighting-catalog.local.toml next to the
# settings, in this same format.
# Windows Dynamic Lighting (HID LampArray) devices need no entry: they're found by their
# usage page.

[[device]]
name = "HP OMEN 45L case lights"
vid = 0x103C
pid = 0x84FD
protocol = "omen-tracer"
kind = "case"
# Mapped in a sitting with the user on 2026-10-26 (#423). Zones 3 and 4 aren't connected on
# the 45L.
# The front is about 205 x 475 mm (HP's spec, rounded). Positions are where each zone shows
# from the front: the three 120 mm front fans under the top chamber, top to bottom 7, 6, 5,
# the interior light behind them (an area light: ambient), the diamond display at the top.
size = [205, 475]
zones = [
    { id = 1, name = "Diamond display", position = [102, 55] },
    { id = 2, name = "Interior light", position = [120, 250], role = "ambient" },
    { id = 5, name = "Front bottom fan", position = [102, 405] },
    { id = 6, name = "Front middle fan", position = [102, 285] },
    { id = 7, name = "Front top fan", position = [102, 165] },
]
# The board's own modes and brightness byte (#423); Foxglove's driver sets static colours only.
effects = ["breathing", "colour cycle", "blinking", "wave", "radial"]
brightness = true
# Neutral to start: each 45L is calibrated on the Lights page ("Calibrate…").
[device.calibration]
gain = [1.0, 1.0, 1.0]
gamma = [1.0, 1.0, 1.0]
brightness = 1.0
# HP's own lighting app drives the same board and puts its colours back.
[[device.conflict]]
app = "OMEN Light Studio"
processes = ["LightStudio-background.exe", "LightStudio.exe"]
hint = "Once Foxglove drives the case, you can remove it: Settings > Apps > Installed apps > OMEN Light Studio > Uninstall. OMEN Command Center stays: it runs the fans and performance modes."

[[device]]
name = "HP OMEN liquid cooler"
vid = 0x03F0
pid = 0x7397
# A Witmod-firmware LCD pump cap (#614): HID caps and HP's helper read on 2026-11-10, nothing
# written. Its ring runs its own firmware rainbow; no ring command is known, so it isn't
# controllable yet. The radiator fans likely chain from the cap's ARGB out.
protocol = "witmod-lcd"
kind = "cooler"
zones = [
    { id = 1, name = "Pump ring" },
    { id = 2, name = "Radiator fans" },
]
effects = ["rainbow"]
[device.witmod]
usage_page = 0xFF1A
usage = 0x93
report_ids = [1, 2]
input_len = 512
output_len = 1024
claim_op = 0x41
claim_every_ms = 1000
# HP's 360 mm cooler: 16 LEDs in the cap, 10 per fan, three fans.
ring_leds = 16
fan_leds = 10
fans = 3
# The pump head's LCD shows pictures and animations through HP's helper app. Its size and
# frame rate aren't measured yet.
[[device.screen]]
images = true
animations = true
# HP's LCD helper holds the cap and re-claims it about once a second.
[[device.conflict]]
app = "OMEN LCD helper"
processes = ["OMENLCDDisplayHelper.exe"]
hint = "It puts the picture on the pump's screen. OMEN Gaming Hub starts it; leave it running while you use the screen."

[[device]]
name = "HP OMEN liquid cooler"
vid = 0x03F0
pid = 0x02BE
# Unconfirmed: HP's LCD helper looks for this second LCD cooler (#614); no unit seen yet, and
# its protocol isn't known.
protocol = "none"
kind = "cooler"
unconfirmed = true

# Starting white balances for the match calibrator (#473). `gain` is each channel's gain in
# linear light (red, green, blue; 1 = unchanged, 0 to 2), as in [device.calibration]. `kinds`,
# optional, lists the device classes that start from it unless their entry names another
# hint. The values are FastLED's colour correction presets (src/color.h, LEDColorCorrection;
# FastLED is MIT licensed, https://github.com/FastLED/FastLED), as fractions of 255: FastLED
# scales each channel's PWM duty, which is linear light, so they map straight to our gains.
# TypicalSMD5050 and TypicalLEDStrip are both 0xFFB0F0: WS2812-style strips and underglow.
[[calibration_hint]]
id = "typical-smd5050"
gain = [1.0, 0.6902, 0.9412]
kinds = ["strip"]

# Typical8mmPixel = 0xFFE08C: through-hole 8 mm pixels.
[[calibration_hint]]
id = "typical-8mm-pixel"
gain = [1.0, 0.8784, 0.549]
