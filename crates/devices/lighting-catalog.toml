# PC and peripheral lighting that Foxglove recognises by USB VID/PID (#423).
#
# One [[device]] per board. `protocol` names the driver in crates/devices/src/pc_lighting:
#   "omen-tracer"  HP OMEN case lighting board (TracerLED), static colour per zone
#   "none"         recognised, listed as "found, not controllable yet"
# Zones list only the parts that light up; `id` is the board's own zone number.
# Scenes' room map (#483), optional: `size` = [width, height] of the device's front in mm, and a
# zone's `position` = [x, y] in mm from that front's top-left corner (x right, y down). Zones
# without one are spread evenly over the front, top to bottom. A zone's `role` = "ambient"
# marks an area light (a case's interior light): scenes light it with the average of the
# device's other zones, fading in and out with them, instead of at its position ("point", the
# default).
# Capabilities, all optional: `color` = "none" | "on-off" | "single" | "per-zone" | "per-led"
# (per-zone when zones are listed), `effects` (onboard effect names), `brightness`, and
# [[device.screen]] tables: width, height, depth (bits per pixel), fps, images, animations,
# stream (live frames from the PC).
# [device.calibration]: the model's default colour calibration (white-balance `gain`, `gamma`,
# `brightness`, optional `matrix` and `curve`), until the user calibrates their own unit on
# the Lights page. Neutral values change nothing.
# Entries the user adds on the Lights page go to lighting-catalog.local.toml next to the
# settings, in this same format.
# Windows Dynamic Lighting (HID LampArray) devices need no entry: they're found by their
# usage page.

[[device]]
name = "HP OMEN 45L case lights"
vid = 0x103C
pid = 0x84FD
protocol = "omen-tracer"
# Mapped in a sitting with the user on 2026-10-26 (#423). Zones 3 and 4 aren't connected on
# the 45L.
# The front is about 205 x 475 mm (HP's spec, rounded). Positions are where each zone shows
# from the front: the three 120 mm front fans under the top chamber, top to bottom 7, 6, 5,
# the interior light behind them (an area light: ambient), the diamond display at the top.
size = [205, 475]
zones = [
    { id = 1, name = "Diamond display", position = [102, 55] },
    { id = 2, name = "Interior light", position = [120, 250], role = "ambient" },
    { id = 5, name = "Front bottom fan", position = [102, 405] },
    { id = 6, name = "Front middle fan", position = [102, 285] },
    { id = 7, name = "Front top fan", position = [102, 165] },
]
# The board's own modes and brightness byte (#423); Foxglove's driver sets static colours only.
effects = ["breathing", "colour cycle", "blinking", "wave", "radial"]
brightness = true
# Neutral to start: each 45L is calibrated on the Lights page ("Calibrate…").
[device.calibration]
gain = [1.0, 1.0, 1.0]
gamma = [1.0, 1.0, 1.0]
brightness = 1.0

[[device]]
name = "HP OMEN liquid cooler"
vid = 0x03F0
pid = 0x7397
protocol = "none"
# The pump head's LCD shows pictures and animations through HP's helper app. Its size and
# frame rate aren't measured yet.
[[device.screen]]
images = true
animations = true
