[package]
name = "hideout-registry"
version = "0.1.0"
edition = "2021"
description = "Hideout's module registry: installed, enabled and running state (inventory.json, hideout.toml), the Hideout root chain and catalogs, the file check before every launch, and grants."
license = "MIT"

[dependencies]
foxglove-plugin-api = { path = "../plugin-api" }
foxglove-plugin-trust = { path = "../plugin-trust" }
hideout-acl = { path = "../hideout-acl" }
hideout-contract = { path = "../hideout-contract" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
# GetDriveTypeW + the storage bus type: a follow-folder grant only for a program on a local fixed
# drive on an internal bus (never a USB disk that reports "fixed").
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[features]
# Lets a test swap the dev-folder disk and cloud-sync probes for fakes. Off by default and only
# turned on by dev-dependencies, so no shipped build can switch those checks off.
test-probes = []

[dev-dependencies]
# Turns the feature on for this crate's own integration tests.
hideout-registry = { path = ".", features = ["test-probes"] }
# The catalog store tests sign their own catalogs with keys made per run (minisign, MIT).
foxglove-plugin-trust = { path = "../plugin-trust", features = ["sign"] }
