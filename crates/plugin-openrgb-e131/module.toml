# Hideout's manifest (contract §4.10, v1.4): plugin.toml's keys plus the tile and the page.
# Foxglove reads plugin.toml; Hideout reads this file. Keep the shared keys the same.
id = "org.foxglove.openrgb"
name = "OpenRGB"
version = "1.0.0"
kind = "service"
family = "foxglove"
hub = "1.3"
transport = "stdio"
api = { foxglove = "1.3" }
run = ["openrgb-e131.exe"]
permissions = ["devices.read", "lighting.write", "net.listen:udp:127.0.0.1:5568"]
enriches = ["OpenRGB.exe"]
description = "Lets OpenRGB colour your keyboard's lights. Listens on this PC only; nothing leaves your PC."

# The tile shows once OpenRGB has been seen on this PC (UX plan, decision 2).
[[ui.panels]]
id = "tile"
slot = "tile"
title = "OpenRGB"
icon = "lights"
when = "apps.seen.openrgb"

[[ui.panels]]
id = "page"
slot = "page"
title = "OpenRGB"
icon = "lights"
