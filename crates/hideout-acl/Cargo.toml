[package]
name = "hideout-acl"
version = "0.1.0"
edition = "2021"
description = "Current-user-only ACLs for Hideout (contract section 2.3): security descriptors for pipes and the hub's config folder, and a DACL reader. Clean-room MIT."
license = "MIT"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Threading"] }
