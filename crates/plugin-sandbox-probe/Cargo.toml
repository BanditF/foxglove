[package]
name = "plugin-sandbox-probe"
version = "0.0.0"
edition = "2021"
description = "Checks which Windows APIs a plugin can use inside the AppContainer (#215); tests only"
license = "MIT"
publish = false

[[bin]]
name = "sandbox-probe"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
foxglove-plugin-host = { path = "../plugin-host" }
foxglove-plugin-api = { path = "../plugin-api" }
foxglove-devices = { path = "../devices" }
