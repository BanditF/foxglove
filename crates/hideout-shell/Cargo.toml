[package]
name = "hideout-shell"
version = "0.1.0"
edition = "2021"
description = "The Hideout hub's shell: tray, window frame, sidebar, status strip, command palette, theme, placement, single instance and log. Clean-room MIT."
license = "MIT"

[dependencies]
hideout-acl = { path = "../hideout-acl" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
# No default fonts: egui's bundled fonts carry the OFL and Ubuntu font licences, and the hub
# depends only on MIT or Apache-2.0 code (contract §11). The shell loads Windows' own fonts.
hideout-panels = { path = "../hideout-panels" }
eframe = { version = "0.33", default-features = false, features = ["glow", "accesskit"] }
raw-window-handle = "0.6"
tray-icon = "0.24"
# eframe's own winit (no new crate): the hub runs eframe's app on its own loop (`wake`, #935).
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
hideout-contract = { path = "../hideout-contract" }
serde_json = "1"
# Headless review PNGs of the tab strip (the test rasterises egui's meshes itself).
image = { version = "0.25", default-features = false, features = ["png"] }
