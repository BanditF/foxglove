[package]
name = "foxglove-via"
version = "0.3.0"
edition = "2021"
description = "A Devices backend for QMK keyboards that speak VIA over Raw HID, with a command allowlist"
license = "MIT"

[features]
default = ["hid"]
hid = ["dep:hidapi"]
# VIA/Vial writes (keycodes, lighting). Off in 0.2 (#581): without it every write is refused before
# it reaches the keyboard, whatever a caller asks. Turn on in 0.3 after a test on a real board.
via-writes = []

[dependencies]
hidapi = { version = "2.6", optional = true }
# Vial keeps its definition XZ-compressed on the board (#74). MIT.
lzma-rs = "0.3"
foxglove-devices = { path = "../devices" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties"] }

[dev-dependencies]
foxglove-devices = { path = "../devices", features = ["contract"] }
