[package]
name = "foxglove-via"
version = "0.1.0"
edition = "2021"
description = "A Palm backend for QMK keyboards that speak VIA over Raw HID, with a command allowlist"
license = "MIT"

[features]
default = ["hid"]
hid = ["dep:hidapi"]

[dependencies]
hidapi = { version = "2.6", optional = true }
palm = { path = "../palm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
palm = { path = "../palm", features = ["contract"] }
