# Deep sleep after 30 minutes idle (30*60*1000 ms); the user chose 30 over 60 (#218).

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_ZMK_SLEEP=y





# The WS2812 driver comes from the devicetree (Zephyr 4.1 has no WS2812_STRIP).
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Idle auto-off comes from the shield (NICE_VIEW_RGB_IDLE): ZMK's own saves "off" to flash, so a
# half that rebooted after idle (the right, waking from deep sleep) stayed dark.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Uncomment the following line to enable NKRO
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y


# Mouse enable
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
# The backlight (PWM on P1.13, no &bl key in the keymap) is on from boot; turn it off while
# idle like the underglow, so it costs nothing between sessions (#218). It comes back on the
# next key press and nothing is written to flash.
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
# Transmit power comes from the shield: +8 dBm on the left (the PC link), 0 dBm on the right,
# whose only link is the few centimetres to the left (FOXGLOVE_RIGHT_TX_0DBM, #218).

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

#soft off
CONFIG_ZMK_PM_SOFT_OFF=y
# Right-hand screen: animate the art while the keyboard is active
CONFIG_NICE_VIEW_CUSTOM_ANIMATE=y
