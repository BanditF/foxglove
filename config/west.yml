manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
    - name: zzeneg
      url-base: https://github.com/zzeneg
    - name: srwi
      url-base: https://github.com/srwi
  projects:
    - name: zmk
      remote: zmkfirmware
      # ZMK main (Zephyr 4.1), pinned for the #151 port until v0.4.0 is tagged.
      revision: 4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
      import: app/west.yml
    - name: zmk-raw-hid
      url: https://github.com/BanditF/zmk-raw-hid
      revision: nonblocking
    - name: zmk-keypeek-layer-notifier
      remote: srwi
      revision: master
  self:
    path: config
