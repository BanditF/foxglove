manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
    - name: zzeneg
      url-base: https://github.com/zzeneg
    - name: srwi
      url-base: https://github.com/srwi
  projects:
    - name: eyelash_corne
      url: https://github.com/a741725193/zmk-new_corne
      revision: main
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    # nonblocking includes the USB reply recovery (zmk-raw-hid#1, foxglove #434): Raw HID replies
    # come back after a PC restart, and the per-transport counters (zmk-raw-hid#3, raw_hid/stats.h
    # version 2: a Bluetooth report nobody listens for is skipped, not failed).
    # #942: pinned to zmk-raw-hid#5 (BLE reports skipped, counted ble_early, while the ATT MTU is
    # below a report); back to nonblocking once that PR merges.
    - name: zmk-raw-hid
      url: https://github.com/BanditF/zmk-raw-hid
      revision: 09a35114d4af1b29b00ffebbf2c121916ca23291
    - name: zmk-keypeek-layer-notifier
      remote: srwi
      revision: master
  self:
    path: config
