# Board profile (#75): what Foxglove needs to know about a keyboard that the firmware doesn't
# say. A new board is a profile like this plus firmware with the host link; no app code.
# The firmware's own screen descriptors (HELLO capability SCREENS) win over [[screens]] here.
format = "foxglove-board"
version = 1
id = "eyelash-corne"
name = "Eyelash Corne"
status = "tested"
protocol = "zmk"
# Its parts (#559): `halves = 2` is a left and a right half, `halves = 1` one piece
# ("Keyboard"). A profile can name its own instead, the one the PC talks to first:
#   [[parts]]
#   id = "main"
#   name = "Main board"
halves = 2
# The keymap source behind Settings' layer-access hints: a built-in one, or a .keymap file
# next to a profile in the boards folder.
keymap = "eyelash_corne"

[[match]]
vid = 0x1d50
pid = 0x615e
product = "Eyelash Corne"

[[screens]]
kind = "panel"
half = "left"
width = 64
height = 52
format = "1bit"

# Screens are named by role ("Info screen", "Art screen"); `name = "..."` names one. The art
# screen is mounted on its side: 140x68 as stored, 68x140 upright (`rotate = 90`).
[[screens]]
kind = "art"
half = "right"
width = 140
height = 68
format = "1bit"
rotate = 90

[lighting]
lamps = 42
layout = "per-key LEDs in 6 column groups per half"
# The LED map (#529, #607, #608): what each pixel of the left half's strip lights, in chain order
# (SET_FRAME lamps 0-20), as indices into the drawing's keys below (each column top to bottom,
# outer column first: 0-17; then the thumbs, outer first: 18-20). The right half mirrors it
# (lamps 21-41).
# The board drives its per-key LEDs a column at a time: each pixel lights one column's 3 keys
# plus that column's thumb key, if it has one, all in the same colour. Pixel 0 is the inner
# column (T, G, B) and Space, then outward. Seen on the board in the 0.2 sitting (#607: one
# frame lit pixels 0-6 as a rainbow over the columns). The strip is 21 long, as in the vendor's
# firmware, but only the first 6 pixels light anything: [] marks a pixel that lights nothing
# (pixel 6 likely, 7-20 surely), so scenes and the dot test skip it.
# A number instead of a list is one key per pixel (a per-key board).
# "shipped": scenes use it, and the app asks once for the dot test (Lights > Keyboard card >
# "Check LED map...") to confirm or turn it round; "checked" once that confirmed it on a board.
# "Find my LEDs" (one click per LED) saves the user's own map in foxglove.toml [led_map], which
# wins.
led_keys = [
  [15, 16, 17, 20], # pixel 0: inner column (T G B) + Space
  [12, 13, 14, 19], # pixel 1: R F V + the middle thumb
  [9, 10, 11, 18],  # pixel 2: E D C + the outer thumb
  [6, 7, 8],        # pixel 3: W S X
  [3, 4, 5],        # pixel 4: Q A Z
  [0, 1, 2],        # pixel 5: outer column
  [],               # pixel 6: nothing seen
  [], [], [], [], [], [], [], [], [], [], [], [], [], [], # pixels 7-20: nothing
]
led_map = "shipped"

# How the Keyboard page draws one half (the left; the right mirrors it), in key units: the
# key grid, each column's drop from the highest (outer column first), and the thumb keys.
# A one-piece board's drawing is the whole board. Instead of the grid, a drawing can list each
# key's top-left corner and width as KLE does: keys = [[0, 0], [1, 0, 1.5], ...].
[drawing]
columns = 6
rows = 3
thumbs = 3
stagger = [0.5, 0.5, 0.25, 0.0, 0.125, 0.25]

# What the firmware build lets ZMK Studio do (#580), as data; the board's own answers win once a
# Studio session is open. `editing`: built with CONFIG_ZMK_STUDIO=y (the left half's Studio
# build). `locking`: CONFIG_ZMK_STUDIO_LOCKING (ZMK's default is on; ours is off).
# `reserved_layers`: keymap layers with status = "reserved", all Studio's "Add layer" can enable
# (none means NO_SPACE). `zmk`: the ZMK release it builds on; v0.3 can't save more than 190 keys
# from Studio (fixed on ZMK main, zmk #3431).
[studio]
editing = true
locking = false
reserved_layers = 3
zmk = "v0.3.0"
