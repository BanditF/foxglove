# Board profile (#75): what Foxglove needs to know about a keyboard that the firmware doesn't
# say. A new board is a profile like this plus firmware with the host link; no app code.
# The firmware's own screen descriptors (HELLO capability SCREENS) win over [[screens]] here.
format = "foxglove-board"
version = 1
id = "eyelash-corne"
name = "Eyelash Corne"
status = "tested"
protocol = "zmk"
halves = 2
# The keymap source behind Settings' layer-access hints: a built-in one, or a .keymap file
# next to a profile in the boards folder.
keymap = "eyelash_corne"

[[match]]
vid = 0x1d50
pid = 0x615e
product = "Eyelash Corne"

[[screens]]
kind = "panel"
half = "left"
width = 64
height = 52
format = "1bit"

[[screens]]
kind = "art"
half = "right"
width = 140
height = 68
format = "1bit"

[lighting]
lamps = 42
layout = "underglow, 21 per half"
# The LED map (#529), shipped but NOT yet checked on the board: which key each LED of the left
# half's strip sits under, in chain order (SET_FRAME lamps 0-20), as an index into the drawing's
# keys below (each column top to bottom, outer column first: 0-17; then the thumbs, outer first:
# 18-20). The right half mirrors it (lamps 21-41).
# Source: the Eyelash Corne's PCB isn't public (its ZMK board only says chain-length 21), so this
# is the per-key chain of foostan's Corne (crkbd rev1) from QMK's keyboards/crkbd/rev1/
# keyboard.json (rgb_matrix.layout, LEDs 6-26: QMK is GPL-2.0-or-later; only the order is taken):
# the inner thumb, up the inner column, down the next, the middle and outer thumbs, then a snake
# out to the outer column. The Eyelash's 21 LEDs a half match crkbd's 21 per-key ones.
# "shipped": scenes use it, and the app asks once for the dot test (Lights > Keyboard card >
# "Check LED map...") to confirm or turn it round; "checked" once that confirmed it on a board.
# "Find my LEDs" (one click per LED) saves the user's own map in foxglove.toml [led_map], which
# wins.
led_keys = [20, 17, 16, 15, 12, 13, 14, 19, 18, 11, 10, 9, 6, 7, 8, 5, 4, 3, 0, 1, 2]
led_map = "shipped"

# How the Keyboard page draws one half (the left; the right mirrors it), in key units: the
# key grid, each column's drop from the highest (outer column first), and the thumb keys.
[drawing]
columns = 6
rows = 3
thumbs = 3
stagger = [0.5, 0.5, 0.25, 0.0, 0.125, 0.25]
