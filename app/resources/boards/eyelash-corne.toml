# Board profile (#75): what Foxglove needs to know about a keyboard that the firmware doesn't
# say. A new board is a profile like this plus firmware with the host link; no app code.
# The firmware's own screen descriptors (HELLO capability SCREENS) win over [[screens]] here.
format = "foxglove-board"
version = 1
id = "eyelash-corne"
name = "Eyelash Corne"
status = "tested"
protocol = "zmk"
halves = 2
# The keymap source behind Settings' layer-access hints: a built-in one, or a .keymap file
# next to a profile in the boards folder.
keymap = "eyelash_corne"

[[match]]
vid = 0x1d50
pid = 0x615e
product = "Eyelash Corne"

[[screens]]
kind = "panel"
half = "left"
width = 64
height = 52
format = "1bit"

[[screens]]
kind = "art"
half = "right"
width = 140
height = 68
format = "1bit"

[lighting]
lamps = 42
layout = "underglow, 21 per half"
# PROVISIONAL LED map (#529), NOT checked on the board: which key each LED of the left half's
# strip sits under, in chain order (SET_FRAME lamps 0-20), as an index into the drawing's keys
# below (each column top to bottom, outer column first: 0-17; then the thumbs, outer first:
# 18-20). The right half mirrors it (lamps 21-41). This guess is a column snake; the LED-order
# sitting (#90 row G) corrects it. Scenes use it only once led_map says "checked"; until then
# each half gets one colour. To try a corrected map, copy this file into the boards folder
# next to Foxglove's settings, edit led_keys, set led_map = "checked" and reconnect.
led_keys = [0, 1, 2, 5, 4, 3, 6, 7, 8, 11, 10, 9, 12, 13, 14, 17, 16, 15, 18, 19, 20]
led_map = "provisional"

# How the Keyboard page draws one half (the left; the right mirrors it), in key units: the
# key grid, each column's drop from the highest (outer column first), and the thumb keys.
[drawing]
columns = 6
rows = 3
thumbs = 3
stagger = [0.5, 0.5, 0.25, 0.0, 0.125, 0.25]
