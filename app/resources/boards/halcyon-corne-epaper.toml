# Board profile (#75). Untested: Halcyon wireless with splitkb's e-paper module (SSD1680), one
# per half when fitted (Scout's #157). Needs Foxglove's host link added to splitkb's ZMK module.
format = "foxglove-board"
version = 1
id = "halcyon-corne-epaper"
name = "Halcyon Corne (e-paper)"
status = "untested"
protocol = "zmk"
halves = 2

[[match]]
vid = 0x1d50
pid = 0x615e
product = "Halcyon Corne"

# E-paper with partial refresh, a frame a second at most (#833): art plays at no more than 1 fps,
# and only its first frame unless animation is switched on. Screens say `refresh = "fast"`
# (the default), `epaper-partial` or `epaper-full`, and `min_frame_ms` (0, the default: no limit).
[[screens]]
kind = "display"
half = "left"
width = 88
height = 184
format = "1bit"
refresh = "epaper-partial"
min_frame_ms = 1000

[[screens]]
kind = "display"
half = "right"
width = 88
height = 184
format = "1bit"
refresh = "epaper-partial"
min_frame_ms = 1000
