[package]
name = "foxglove"
license = "GPL-3.0-only"
description = "Foxglove: keyboard layer overlay and screens for the Eyelash Corne; based on KeyPeek"
authors = ["Stephan Rumswinkel", "BanditF"]
repository = "https://github.com/BanditF/foxglove"
readme = "README.md"
version = "0.3.0"
edition = "2021"

[features]
# Foxglove (#581, #723): VIA/Vial writes (keymap, lighting, layout options). Off by default; one
# switch for the VIA backend and the KeyPeek VIA/Vial adapters (`foxglove_via::writes_enabled()`).
# Even in a build with it, writes stay off unless the hidden dev switch FOXGLOVE_VIA_WRITES=1 is
# set, for the real-board test (docs/test-lab/via-writes-real-board.md).
via-writes = ["foxglove-via/via-writes"]
# Lab builds only (#1143): FOXGLOVE_LAB_PANIC=<key> makes a page or tray tile's draw panic, to
# prove the page guard on the real app. Off by default and never in a release build.
lab-hooks = []

[dependencies]
foxglove-update = { path = "../crates/foxglove-update" }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
# Foxglove: the shared link to the keyboard (MIT).
foxglove-link = { path = "../crates/foxglove-link", features = ["devices"] }
# Foxglove: the device layer (MIT).
foxglove-devices = { path = "../crates/devices", features = ["hid"] }
foxglove-scene = { path = "../crates/scene" }
# Foxglove: QMK keyboards over VIA, read-only (MIT).
foxglove-via = { path = "../crates/via" }
# Foxglove: the local API host and its protocol (MIT).
foxglove-plugin-host = { path = "../crates/plugin-host" }
foxglove-plugin-api = { path = "../crates/plugin-api" }
foxglove-plugin-trust = { path = "../crates/plugin-trust" }
# Foxglove (#499): the live wallpaper feed's WebSocket side (MIT) and its pairing token.
foxglove-plugin = { path = "../crates/plugin-sdk" }
# Foxglove (#1143 P5): a hub peer's integrity level and AppContainer (MIT).
hideout-acl = { path = "../crates/hideout-acl" }
getrandom = "0.3"
# Foxglove: unpacking plugins in the Plugins tab.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Foxglove: plugins' panel frames arrive as base64.
base64 = "0.22"
foxglove-panel = { path = "../crates/panel" }
foxglove-flash = { path = "../crates/flash" }
# Foxglove: tells when Windows redirected a file into another app's package (#896, #894).
foxglove-redirect = { path = "../crates/redirect" }
toml = "0.9"
prost = "0.14"
rust-ini = "0.21.3"
directories = "6.0.0"
tray-icon = "0.24.2"
egui = "0.36.1"
# Keep the native Glow backends, without the AccessKit Windows subclass.
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11"] }
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
qmk-via-api = "0.9.0"
hidapi = { version = "2.6.5", features = ["macos-shared-device"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
egui-phosphor = "0.13.0"
egui-file-dialog = "0.15.0"
image = "0.25.10"
lzma-rs = "0.3"
serialport = "4.10.0"
zmk-studio-api = { version = "0.6.0", features = ["serial", "ble"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
winit = { version = "0.30.13", features = ["x11"] }
egui_glow = "0.36.1"
xkbcommon = "0.9.0"
x11rb = { version = "0.14.0", features = ["allow-unsafe-code"] }
smithay-client-toolkit = "0.21.1"
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
khronos-egl = { version = "6", features = ["static"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30.13"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-collections = "0.3.2"
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Win32_Devices_Properties",
    "Devices_Radios",
    # Foxglove: the sparse identity package (#179).
    "ApplicationModel",
    "Management_Deployment",
    "Foundation",
    "UI",
    "UI_ViewManagement",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    # Foxglove (#741): the Startup-folder shortcut (IShellLinkW, IPersistFile).
    "Win32_System_Com",
    "Win32_System_Registry",
    # Foxglove (#410): lock/unlock and display on/off.
    "Win32_System_Power",
    # Foxglove (#372): the low-battery notification.
    "UI_Notifications",
    # Foxglove (#507): Windows notifications on the left screen.
    "UI_Notifications_Management",
    "Data_Xml_Dom",
    # Foxglove (#370): stderr into the log file.
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    # Foxglove (#346): the GPU-reset watch.
    "Win32_System_EventLog",
    # Foxglove (#423): is OMEN Light Studio running? And LampArray attributes.
    "Devices_Lights",
    # Foxglove (#504): controllers' batteries.
    "Gaming_Input",
    "Devices_Power",
    "System_Power",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    # Foxglove (#802): Raw Input device handles, for "Follow the keyboard I type on".
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Foxglove: display scaling, for the Settings window's place across displays.
    "Win32_UI_HiDpi",
    # Foxglove (#447): the test that reads back the embedded manifest.
    "Win32_System_LibraryLoader",
    # Foxglove (#496): Screen glow reads the screens' edges (DXGI Desktop Duplication, a GPU
    # downscale through Direct3D 11 mips).
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Foxglove (#1085): a screen's SDR white level, for Screen glow on an HDR desktop.
    "Win32_Devices_Display",
] }
winreg = "0.56.0"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.31"
# Foxglove (#179): tools/local.toml's [identity] (build.rs, identity_build.rs).
toml = "0.9"

[package.metadata.bundle]
name = "Foxglove"
identifier = "dev.banditf.foxglove"
osx_info_plist_exts = ["resources/macos-info-plist-ext.xml"]

[package.metadata.appimage]
# Bundle only libxdo: it's the one dependency that is NOT part of every
# mainstream distro's base desktop stack (Ubuntu/Fedora/Arch etc. all ship
# GTK/X11/Wayland/Mesa already, but libxdo comes from the niche `xdotool`
# project and is often missing or has a different soname). Everything else
# stays excluded so we don't ship a second copy of GTK/Mesa/X11 that could
# clash with the host's graphics drivers and theme integration.
auto_link = true
auto_link_exclude_list = [
    "ld-linux*", "libc.so*", "libm.so*", "libdl.so*", "libpthread.so*", "librt.so*",
    "libgcc_s.so*", "libstdc++.so*",
    "libgtk-3.so*", "libgdk-3.so*", "libgdk_pixbuf-2.0.so*", "libgio-2.0.so*",
    "libgobject-2.0.so*", "libglib-2.0.so*", "libgmodule-2.0.so*",
    "libX11.so*", "libXi.so*", "libXext.so*", "libXfixes.so*", "libXcursor.so*",
    "libXdamage.so*", "libXcomposite.so*", "libXrandr.so*", "libXinerama.so*",
    "libXrender.so*", "libXau.so*", "libXdmcp.so*", "libxcb*.so*",
    "libwayland-*.so*", "libEGL.so*", "libGLdispatch.so*", "libepoxy.so*",
    "libxkbcommon.so*",
    "libpango*.so*", "libcairo*.so*", "libharfbuzz.so*", "libfribidi.so*",
    "libfontconfig.so*", "libfreetype.so*", "libthai.so*", "libdatrie.so*",
    "libgraphite2.so*", "libpixman-1.so*", "libpng16.so*",
    "libatk*.so*", "libatspi.so*", "libcloudproviders.so*", "libtinysparql*.so*",
    "libglycin*.so*",
    "libudev.so*", "libsystemd.so*", "libdbus-1.so*", "libmount.so*", "libblkid.so*",
    "libffi.so*", "libpcre2*.so*", "libz.so*", "libbz2.so*", "libbrotli*.so*",
    "libseccomp.so*", "libexpat.so*", "libjson-glib*.so*", "libxml2.so*",
    "libsqlite3.so*", "liblcms2.so*", "libicu*.so*",
]

[dev-dependencies]
# Foxglove (#1143 P5): the hub's own router and contract (MIT, no egui) to test the module link
# against, in process: no pipe, no window.
hideout-router = { path = "../crates/hideout-router" }
hideout-contract = { path = "../crates/hideout-contract" }
# Foxglove: the devices crate's fakes (the scripted HID++ device, #505; the in-process OpenRGB
# server, #471) for window- and
# device-free tests.
foxglove-devices = { path = "../crates/devices", features = ["hid", "mock"] }
# Foxglove: checks that the built-in plugin icons render (the resvg egui_extras uses).
resvg = { version = "0.45", default-features = false }
# Foxglove: a fake keyboard for the art tests answers foxglove-link's Transport, whose results are anyhow's.
anyhow = "1"
# Foxglove: a port that refuses connections and stays ours (bound, never listening), for the
# OpenRGB retry test (#1006). Already in the tree (through tokio).
socket2 = "0.6"

# Foxglove: smaller dev/test builds (same as the root workspace; see its Cargo.toml).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
