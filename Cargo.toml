# Desktop side of Foxglove. The firmware (boards/, config/) is built by ZMK's own workflow.
[workspace]
resolver = "2"
members = ["crates/*", "examples/hideout-module-rust", "examples/hideout-room-map"]
# The app keeps its own workspace and lockfile, as upstream KeyPeek has them, so pulling
# from srwi/keypeek stays clean. Build it with --manifest-path app/Cargo.toml.
exclude = ["app", "vendor"]

# Hideout (#1381): two minimal vendored patches so AccessKit can be on in the hub without the
# window-creation panic (Windows' atom table full) and for every window, not only the root.
# Both are marked "HIDEOUT PATCH" in their sources; see vendor/README.md. `vendor` is excluded
# above so the workspace's fmt, clippy and tests do not pick the copies up as members.
[patch.crates-io]
accesskit_windows = { path = "vendor/accesskit_windows" }
eframe = { path = "vendor/eframe" }

[profile.release]
opt-level = "s"
lto = true

# Dev and test builds keep file:line backtraces but drop full debug info, and dependencies
# carry none: a workspace test build drops from ~2.0 to ~1.2 GB, and every worktree has one.
# For a debugger session: CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
